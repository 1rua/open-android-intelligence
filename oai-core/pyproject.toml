[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-android-intelligence-core"
version = "0.2.0"
description = "One OAI Core service, Android device scheduler, CLI and MCP entrypoint"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11,<4",
  "mcp>=1.20,<2",
  "jsonschema>=4.23,<5",
  "cryptography>=42",
  "yarl>=1.17,<2",
]

[project.scripts]
oai = "oai_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oai_core.gateway" = ["contracts/**/*", "contracts/*"]
"oai_core.skills" = ["**/*", "*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
