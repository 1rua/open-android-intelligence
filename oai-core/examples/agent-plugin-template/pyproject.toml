[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oai-sample-agent-plugin"
version = "0.1.0"
description = "Sample custom Agent plugin for OAI Core"
requires-python = ">=3.11"
dependencies = [
    "open-android-intelligence-core>=0.2.0",
]

[project.entry-points."open_android_intelligence.agent_adapters"]
sample-custom = "adapter:create_sample_adapter"
