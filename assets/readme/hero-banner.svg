<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto" role="img" aria-label="Open Android Intelligence 首屏横幅：手机连上你自己部署的 AI Agent，经 Gateway 协议 v2 加密链路；不 Root、不后台扫盘、插件按需装" fill="none">
  <title>Open Android Intelligence · 让手机接上自托管 AI Agent</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08110E"/>
      <stop offset="1" stop-color="#0D1A15"/>
    </linearGradient>
    <radialGradient id="glowMint" gradientUnits="userSpaceOnUse" cx="170" cy="120" r="260">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSky" gradientUnits="userSpaceOnUse" cx="1010" cy="330" r="300">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#34D399"/>
    </pattern>
    <clipPath id="canvasClip">
      <rect width="1200" height="400" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .pill-label { font-size: 20px; font-weight: 600; fill: #34D399; }
    .hero-title { font-size: 46px; font-weight: 800; fill: #F3F7F5; letter-spacing: -1px; }
    .hero-sub   { font-size: 20px; font-weight: 400; fill: #9DB0AA; }
    .chip-label { font-size: 19px; font-weight: 500; fill: #F3F7F5; }
    .seg-title  { font-size: 21px; font-weight: 600; fill: #F3F7F5; }
    .seg-desc   { font-size: 19px; font-weight: 400; fill: #9DB0AA; }
    .flow-note  { font-size: 18px; font-weight: 400; fill: #7E918C; }
  </style>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <!-- 画布底 -->
    <rect width="1200" height="400" rx="20" fill="url(#bgGrad)"/>
    <g clip-path="url(#canvasClip)">
      <rect width="1200" height="400" fill="url(#dotGrid)" opacity="0.035"/>
      <circle cx="170" cy="120" r="260" fill="url(#glowMint)" opacity="0.06"/>
      <circle cx="1010" cy="330" r="300" fill="url(#glowSky)" opacity="0.05"/>
    </g>

    <!-- 左栏：胶囊标签 -->
    <rect x="64" y="56" width="360" height="36" rx="18" fill="#12211B" stroke="#2E4A3E" stroke-width="1.5"/>
    <circle cx="86" cy="74" r="6" fill="#34D399"/>
    <text x="102" y="81" class="pill-label">自托管 AI Agent × Android 手机</text>

    <!-- 左栏：标题与白话价值主张 -->
    <text x="64" y="150" class="hero-title">Open Android Intelligence</text>
    <text x="64" y="208" class="hero-sub">让你的手机接上自己部署的 AI Agent</text>
    <text x="64" y="240" class="hero-sub">读什么、做什么，由你在手机上点头才算数</text>

    <!-- 左栏：三个承诺胶囊 -->
    <g>
      <rect x="64" y="292" width="136" height="44" rx="22" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
      <g transform="translate(80 302)" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M12 2.5 19 5v5.6c0 4.6-3 8-7 9.4-4-1.4-7-4.8-7-9.4V5l7-2.5Z"/>
        <path d="M8.8 11.4l2.3 2.3 4.1-4.2"/>
      </g>
      <text x="114" y="321" class="chip-label">不 Root</text>
    </g>
    <g>
      <rect x="212" y="292" width="166" height="44" rx="22" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
      <g transform="translate(228 302)" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="10.5" cy="10.5" r="6"/>
        <path d="M15 15l5 5"/>
        <path d="M4.5 19.5 19.5 4.5"/>
      </g>
      <text x="262" y="321" class="chip-label">不后台扫盘</text>
    </g>
    <g>
      <rect x="390" y="292" width="166" height="44" rx="22" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
      <g transform="translate(406 302)" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M9 2.5v4M15 2.5v4"/>
        <path d="M6 6.5h12v4.5a6 6 0 0 1-12 0V6.5Z"/>
        <path d="M12 17v4.5"/>
      </g>
      <text x="440" y="321" class="chip-label">插件按需装</text>
    </g>

    <!-- 右栏：链路面板 -->
    <rect x="700" y="40" width="436" height="320" rx="20" fill="#101C17" stroke="#22382F" stroke-width="1.5"/>

    <!-- 第 1 段：你的手机 -->
    <rect x="716" y="52" width="404" height="72" rx="14" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
    <rect x="730" y="66" width="44" height="44" rx="12" fill="#16281F"/>
    <g transform="translate(740 76)" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M8 2.5h8A1.5 1.5 0 0 1 17.5 4v16a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 20V4A1.5 1.5 0 0 1 8 2.5Z"/>
      <path d="M10.5 18.5h3"/>
    </g>
    <text x="792" y="82" class="seg-title">你的手机</text>
    <text x="792" y="106" class="seg-desc">Android 宿主 + 平台内核</text>

    <!-- 手机到协议：加密隧道 -->
    <path d="M752 127v27" stroke="#2E4A3E" stroke-width="2" stroke-linecap="round"/>
    <polygon points="747,154 757,154 752,161" fill="#2E4A3E"/>
    <text x="792" y="150" class="flow-note">HTTPS + SSE 加密隧道</text>

    <!-- 第 2 段：Gateway 协议 v2 -->
    <rect x="716" y="164" width="404" height="72" rx="14" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
    <rect x="730" y="178" width="44" height="44" rx="12" fill="#16281F"/>
    <g transform="translate(740 188)" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12 2.5 19 5v5.6c0 4.6-3 8-7 9.4-4-1.4-7-4.8-7-9.4V5l7-2.5Z"/>
      <circle cx="12" cy="10" r="1.4"/>
      <path d="M12 11.4v2.8"/>
    </g>
    <text x="792" y="194" class="seg-title">Gateway 协议 v2</text>
    <text x="792" y="218" class="seg-desc">签名 · 校验 · 防重放</text>

    <!-- 协议到服务器：同一套契约 -->
    <path d="M752 239v27" stroke="#2E4A3E" stroke-width="2" stroke-linecap="round"/>
    <polygon points="747,266 757,266 752,273" fill="#2E4A3E"/>
    <text x="792" y="262" class="flow-note">同一套契约，两端逐条对齐</text>

    <!-- 第 3 段：你的服务器 -->
    <rect x="716" y="276" width="404" height="72" rx="14" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
    <rect x="730" y="290" width="44" height="44" rx="12" fill="#16281F"/>
    <g transform="translate(740 300)" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="3.5" y="3.5" width="17" height="7.5" rx="2"/>
      <rect x="3.5" y="13" width="17" height="7.5" rx="2"/>
      <path d="M7 7.25h2M7 16.75h2"/>
    </g>
    <text x="792" y="306" class="seg-title">你的服务器</text>
    <text x="792" y="330" class="seg-desc">Hermes / OpenClaw 原生插件</text>
  </g>
</svg>
