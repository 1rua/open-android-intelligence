<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto" role="img" aria-label="Open Android Intelligence 首屏横幅：一个统一的安卓客户端，用于连接多种主流 Agent；无需手机部署、接入手机能力、远程 Agent 同步">
  <title>Open Android Intelligence · 连接多种主流 Agent 的统一安卓客户端</title>
  <desc>复古未来主义航天工程档案：黑白灰制图纸、超粗几何标题、倾斜轨道椭圆串起设备、协议与 Agent 三个节点，橙色天体标记终点，外围同心圆、刻度与遥测参数构成工程制图结构。</desc>

  <defs>
    <pattern id="heroGrain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#111111" opacity="0.1"/>
      <circle cx="5" cy="4" r="0.38" fill="#111111" opacity="0.06"/>
    </pattern>
    <pattern id="heroHalftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#111111" opacity="0.4"/>
    </pattern>
    <clipPath id="heroClip">
      <rect x="20" y="20" width="1160" height="336"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", monospace; font-size: 18px; letter-spacing: 0.8px; fill: #4E4E4E; }
    .mono-d { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", monospace; font-size: 18px; letter-spacing: 0.8px; fill: #111111; }
    .mono-m { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", monospace; font-size: 18px; letter-spacing: 0.8px; fill: #8B8B86; }
    .num { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", monospace; font-size: 18px; letter-spacing: 1.2px; fill: #A9502A; }
    .disp { font-family: "Arial Black", "Inter", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif; font-weight: 900; font-size: 64px; letter-spacing: -1.8px; fill: #111111; }
    .lede { font-family: "Helvetica Neue", Arial, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.2px; fill: #111111; }
    .body { font-family: "Helvetica Neue", Arial, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 400; letter-spacing: 0.2px; fill: #4E4E4E; }
    .tag { font-family: "Helvetica Neue", Arial, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 600; fill: #111111; }
  </style>

  <rect width="1200" height="400" fill="#F7F7F5"/>
  <rect width="1200" height="400" fill="url(#heroGrain)"/>
  <rect x="20" y="20" width="1160" height="360" fill="none" stroke="#111111" stroke-width="1.2"/>

  <g stroke="#111111" stroke-width="1">
    <path d="M10 20H30M20 10V30"/>
    <path d="M1170 20H1190M1180 10V30"/>
    <path d="M10 380H30M20 370V390"/>
    <path d="M1170 380H1190M1180 370V390"/>
  </g>

  <text x="44" y="47" class="mono-d" style="letter-spacing:1.4px">OPEN ANDROID INTELLIGENCE</text>
  <text x="560" y="47" class="mono">TECHNICAL DOSSIER / SHEET 01</text>
  <text x="1156" y="47" class="mono" text-anchor="end">REV 2.1.1 / 2026</text>
  <path d="M44 64H1156" stroke="#111111" stroke-width="1"/>
  <path d="M700 64V356" stroke="#111111" stroke-width="1"/>
  <path d="M44 356H1156" stroke="#111111" stroke-width="1"/>

  <text x="44" y="96" class="num">UNIFIED ANDROID CLIENT / MULTI-AGENT LINK</text>
  <text x="42" y="164" class="disp">OPEN ANDROID</text>
  <text x="42" y="228" class="disp">INTELLIGENCE</text>
  <rect x="44" y="242" width="56" height="4" fill="#A9502A"/>
  <text x="44" y="270" class="lede">一个统一的安卓客户端，用于连接多种主流 Agent</text>
  <text x="44" y="296" class="body">客户端仅提供设备能力，决策全由 Agent 负责</text>
  <path d="M44 314H674" stroke="#C9C9C2" stroke-width="1"/>

  <g>
    <text x="44" y="340" class="num">01</text>
    <text x="72" y="340" class="tag">无需手机部署</text>
    <text x="220" y="340" class="num">02</text>
    <text x="248" y="340" class="tag">接入手机能力</text>
    <text x="396" y="340" class="num">03</text>
    <text x="424" y="340" class="tag">远程 Agent 同步</text>
  </g>

  <g clip-path="url(#heroClip)">
    <path d="M724 210H1116" stroke="#E2E2DA" stroke-width="0.8"/>
    <path d="M928 92V318" stroke="#E2E2DA" stroke-width="0.8"/>
    <circle cx="928" cy="210" r="112" fill="none" stroke="#E2E2DA" stroke-width="0.8"/>
    <circle cx="928" cy="210" r="86" fill="none" stroke="#D6D6CE" stroke-width="0.8"/>
    <g stroke="#C9C9C2" stroke-width="0.8">
      <path d="M928 92V102"/>
      <path d="M928 318V328"/>
      <path d="M724 204V216"/>
      <path d="M1132 204V216"/>
      <path d="M1072 96V106" transform="rotate(30 928 210)"/>
      <path d="M1072 96V106" transform="rotate(60 928 210)"/>
      <path d="M1072 96V106" transform="rotate(120 928 210)"/>
      <path d="M1072 96V106" transform="rotate(150 928 210)"/>
    </g>

    <ellipse cx="928" cy="210" rx="172" ry="52" fill="none" stroke="#111111" stroke-width="1.4" transform="rotate(-17 928 210)"/>
    <ellipse cx="928" cy="210" rx="124" ry="37" fill="none" stroke="#8B8B86" stroke-width="0.8" stroke-dasharray="3 8" transform="rotate(-17 928 210)"/>

    <circle cx="737" cy="302" r="20" fill="url(#heroHalftone)" opacity="0.55"/>
    <circle cx="737" cy="302" r="20" fill="none" stroke="#111111" stroke-width="0.8" stroke-opacity="0.4"/>
    <g stroke="#8B8B86" stroke-width="0.8">
      <path d="M737 276V282M737 322V328M711 302H717M757 302H763"/>
    </g>
  </g>

  <text x="724" y="88" class="mono-d">MISSION SCHEMATIC / FIG. 01</text>
  <text x="1156" y="88" class="mono" text-anchor="end">N.T.S.</text>
  <text x="724" y="110" class="mono-m">DEVICE → GATEWAY → AGENT</text>
  <text x="1156" y="110" class="mono-m" text-anchor="end">AZ 0.0°</text>

  <g>
    <circle cx="768" cy="241" r="6" fill="#F7F7F5" stroke="#111111" stroke-width="1.6"/>
    <circle cx="768" cy="241" r="2.4" fill="#6F6F6A"/>
    <circle cx="994" cy="142" r="6" fill="#F7F7F5" stroke="#111111" stroke-width="1.6"/>
    <circle cx="994" cy="142" r="2.4" fill="#111111"/>
    <circle cx="1093" cy="168" r="8.5" fill="#A9502A"/>
  </g>

  <g class="mono-d">
    <text x="746" y="266" text-anchor="middle" style="fill:#6F6F6A">01</text>
    <text x="994" y="126" text-anchor="middle">02</text>
    <text x="1112" y="160" text-anchor="start" style="fill:#A9502A">03</text>
  </g>

  <path d="M724 330H1156" stroke="#C9C9C2" stroke-width="0.9"/>
  <text x="724" y="350" class="mono"><tspan fill="#6F6F6A">01</tspan> DEVICE</text>
  <text x="858" y="350" class="mono"><tspan fill="#111111">02</tspan> GATEWAY</text>
  <text x="1014" y="350" class="mono"><tspan fill="#A9502A">03</tspan> AGENT</text>

  <text x="44" y="372" class="mono">FIG. 01 / UNIFIED DEVICE LINK</text>
  <text x="1156" y="372" class="mono" text-anchor="end">NO RELAY · NO ROOT · DIRECT LINK</text>
</svg>
