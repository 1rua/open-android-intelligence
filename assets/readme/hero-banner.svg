<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" fill="none">
  <title>Open Android Intelligence Banner</title>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1311"/>
      <stop offset="50%" stop-color="#111d19"/>
      <stop offset="100%" stop-color="#0a100e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162621" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#101c18" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans", sans-serif; font-size: 42px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans", sans-serif; font-size: 19px; font-weight: 400; fill: #9ca3af; line-height: 1.6; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12px; font-weight: 700; fill: #34d399; letter-spacing: 1.5px; text-transform: uppercase; }
    .pill-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: 600; fill: #e5e7eb; }
    .pill-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="20" stroke="#23352f" stroke-width="1.5"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="150" cy="80" r="180" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1020" cy="180" r="220" fill="#2dd4bf" opacity="0.06" filter="url(#glow)"/>

  <!-- Left Hero Content -->
  <g transform="translate(64, 52)">
    <!-- Version / Status Pill -->
    <rect x="0" y="0" width="228" height="30" rx="15" fill="#142822" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4.5" fill="#34d399"/>
    <text x="28" y="19.5" class="tag">MODULAR ARCHITECTURE V2</text>

    <!-- Main Title -->
    <text x="0" y="78" class="title">Open Android Intelligence</text>

    <!-- Subtitle & Value Proposition -->
    <text x="0" y="118" class="subtitle">让 Android 成为连接自托管 AI Agent 的自主智能节点</text>
    <text x="0" y="146" class="subtitle">手机是本机数据与硬件操作的最终裁决者 · 零系统侵入 · 开放可插拔</text>

    <!-- Quick Highlights Badges -->
    <g transform="translate(0, 182)">
      <!-- Badge 1: Platform Kernel -->
      <g transform="translate(0, 0)">
        <rect width="190" height="48" rx="10" fill="url(#cardGrad)" stroke="#223932" stroke-width="1"/>
        <text x="14" y="21" class="pill-title">🛡️ 平台内核裁决</text>
        <text x="14" y="38" class="pill-desc">不可卸载权限守门人</text>
      </g>
      <!-- Badge 2: WASM Plugins -->
      <g transform="translate(204, 0)">
        <rect width="190" height="48" rx="10" fill="url(#cardGrad)" stroke="#223932" stroke-width="1"/>
        <text x="14" y="21" class="pill-title">🧩 .alp 设备插件</text>
        <text x="14" y="38" class="pill-desc">WASM 沙箱与资源配额</text>
      </g>
      <!-- Badge 3: Gateway Protocol v2 -->
      <g transform="translate(408, 0)">
        <rect width="190" height="48" rx="10" fill="url(#cardGrad)" stroke="#223932" stroke-width="1"/>
        <text x="14" y="21" class="pill-title">⚡ 原生 Gateway 适配</text>
        <text x="14" y="38" class="pill-desc">Hermes / OpenClaw 原生内置</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic Visual: Abstract Device & Agent Bridge Flow -->
  <g transform="translate(740, 48)">
    <rect width="396" height="264" rx="16" fill="#13211c" stroke="#253a33" stroke-width="1.2"/>

    <!-- Mini Terminal Bar -->
    <rect width="396" height="34" rx="16" fill="#172822"/>
    <circle cx="20" cy="17" r="4.5" fill="#f87171"/>
    <circle cx="36" cy="17" r="4.5" fill="#fbbf24"/>
    <circle cx="52" cy="17" r="4.5" fill="#34d399"/>
    <text x="74" y="21" font-family="monospace" font-size="12" fill="#9ca3af">gateway-protocol-v2 :: https+sse</text>

    <!-- Visual Interactive Flow Cards -->
    <!-- Card 1: Android Host -->
    <rect x="24" y="56" width="154" height="88" rx="8" fill="#192a24" stroke="#2c453c" stroke-width="1"/>
    <text x="36" y="80" class="pill-title">📱 Android Host</text>
    <text x="36" y="100" class="mono" font-size="11" fill="#6ee7b7">Platform Kernel</text>
    <text x="36" y="118" class="mono" font-size="10" fill="#94a3b8">WASM Sandbox</text>
    <circle cx="162" cy="76" r="3" fill="#34d399"/>

    <!-- Connection Line -->
    <path d="M 178 100 L 216 100" stroke="#34d399" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="216,97 222,100 216,103" fill="#34d399"/>

    <!-- Card 2: In-Host Gateway -->
    <rect x="222" y="56" width="150" height="88" rx="8" fill="#192a24" stroke="#2c453c" stroke-width="1"/>
    <text x="234" y="80" class="pill-title">🤖 Agent Gateway</text>
    <text x="234" y="100" class="mono" font-size="11" fill="#38bdf8">Hermes / OpenClaw</text>
    <text x="234" y="118" class="mono" font-size="10" fill="#94a3b8">Multi-account</text>
    <circle cx="356" cy="76" r="3" fill="#38bdf8"/>

    <!-- Bottom Specs Tray -->
    <rect x="24" y="162" width="348" height="78" rx="8" fill="#15241f" stroke="#233831" stroke-width="1"/>
    <text x="38" y="184" class="mono" font-size="11" fill="#a7f3d0">→ Auth: Ed25519 Request Signature</text>
    <text x="38" y="204" class="mono" font-size="11" fill="#a7f3d0">→ Transport: HTTPS + SSE Event Stream</text>
    <text x="38" y="224" class="mono" font-size="11" fill="#a7f3d0">→ Security: Zero Root / Fail-Closed</text>
  </g>
</svg>
