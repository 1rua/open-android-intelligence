<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" role="img" aria-label="安全模型：Agent 只能提请求，放行还是拒绝由平台内核和你在屏幕上决定">
  <title>决定权始终在手机上</title>
  <desc>四级审批门：Agent 提请求、内核先查权限、你在屏幕上确认、放行或拒绝；右侧列出永远不做的四件事。</desc>
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08110E"/>
      <stop offset="100%" stop-color="#0D1A15"/>
    </linearGradient>
    <radialGradient id="secGlowMint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="secGlowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="secClip">
      <rect width="1200" height="420" rx="20"/>
    </clipPath>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <!-- 背景与氛围光晕（裁剪到圆角画布内，避免光晕溢出四角） -->
    <g clip-path="url(#secClip)">
      <rect width="1200" height="420" rx="20" fill="url(#secBg)"/>
      <ellipse cx="150" cy="52" rx="430" ry="250" fill="url(#secGlowMint)"/>
      <ellipse cx="1070" cy="352" rx="320" ry="220" fill="url(#secGlowRed)"/>
    </g>
    <rect width="1200" height="420" rx="20" fill="none" stroke="#22382F" stroke-width="1.5"/>

    <!-- 标题区 -->
    <text x="64" y="54" font-size="26" font-weight="700" fill="#F3F7F5">决定权始终在手机上</text>
    <text x="64" y="88" font-size="20" font-weight="400" fill="#9DB0AA">Agent 只能提请求；放行还是拒绝，由平台内核和你在屏幕上决定</text>

    <!-- 审批门总标签 -->
    <text x="64" y="142" font-size="18" font-weight="400" fill="#7E918C">每一步都要过手机</text>

    <!-- 第一级：Agent 提请求 -->
    <g transform="translate(64,164)">
      <rect width="176" height="148" rx="14" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
      <g transform="translate(16,16)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4.5" width="18" height="13" rx="2.5"/>
        <path d="M2.4 6.2 L11 12.2 L19.6 6.2"/>
      </g>
      <text x="16" y="64" font-size="20" font-weight="600" fill="#F3F7F5">Agent 提请求</text>
      <text x="16" y="94" font-size="18" font-weight="400" fill="#9DB0AA">说要什么</text>
      <text x="16" y="124" font-size="18" font-weight="400" fill="#9DB0AA">用哪个账号</text>
    </g>

    <!-- 流向箭头 1 -->
    <path d="M245 228 L255 238 L245 248" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>

    <!-- 第二级：内核先查权限 -->
    <g transform="translate(260,164)">
      <rect width="176" height="148" rx="14" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
      <g transform="translate(16,16)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 2.6 L19 5.6 V11.2 C19 15.8 15.6 18.5 11 19.4 C6.4 18.5 3 15.8 3 11.2 V5.6 Z"/>
      </g>
      <text x="16" y="64" font-size="20" font-weight="600" fill="#F3F7F5">内核先查权限</text>
      <text x="16" y="94" font-size="18" font-weight="400" fill="#9DB0AA">查插件能力</text>
      <text x="16" y="124" font-size="18" font-weight="400" fill="#9DB0AA">查授权范围</text>
    </g>

    <!-- 流向箭头 2 -->
    <path d="M441 228 L451 238 L441 248" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>

    <!-- 第三级：你在屏幕上确认 -->
    <g transform="translate(456,164)">
      <rect width="176" height="148" rx="14" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
      <g transform="translate(16,16)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5.5" y="2" width="11" height="18" rx="2.5"/>
        <path d="M8.4 11 L10.6 13.2 L14 9.2"/>
      </g>
      <text x="16" y="64" font-size="20" font-weight="600" fill="#F3F7F5">你在屏幕上确认</text>
      <text x="16" y="94" font-size="18" font-weight="400" fill="#9DB0AA">一次授权</text>
      <text x="16" y="124" font-size="18" font-weight="400" fill="#9DB0AA">只这一次生效</text>
    </g>

    <!-- 流向箭头 3 -->
    <path d="M637 228 L647 238 L637 248" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>

    <!-- 第四级：放行或拒绝 -->
    <g transform="translate(652,164)">
      <rect width="176" height="148" rx="14" fill="#12211B" stroke="#22382F" stroke-width="1.5"/>
      <g transform="translate(16,16)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 3 V9"/>
        <path d="M11 9 L5.6 15.4"/>
        <path d="M11 9 L16.4 15.4"/>
      </g>
      <text x="16" y="64" font-size="20" font-weight="600" fill="#F3F7F5">放行或拒绝</text>
      <text x="16" y="94" font-size="18" font-weight="400" fill="#9DB0AA">拒绝也写进</text>
      <text x="16" y="124" font-size="18" font-weight="400" fill="#9DB0AA">审计记录</text>
    </g>

    <!-- 右侧：我们永远不做 -->
    <g transform="translate(860,112)">
      <rect width="276" height="232" rx="20" fill="#12211B" stroke="#2A3C34" stroke-width="1.5"/>
      <g transform="translate(24,26)" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4 L16 16"/>
        <path d="M16 4 L4 16"/>
      </g>
      <text x="54" y="42" font-size="21" font-weight="700" fill="#F87171">我们永远不做</text>

      <g transform="translate(24,71)" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4 L12 12"/>
        <path d="M12 4 L4 12"/>
      </g>
      <text x="50" y="84" font-size="18" font-weight="400" fill="#C7D4CF">远程 root shell</text>

      <g transform="translate(24,111)" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4 L12 12"/>
        <path d="M12 4 L4 12"/>
      </g>
      <text x="50" y="124" font-size="18" font-weight="400" fill="#C7D4CF">后台翻你的文件</text>

      <g transform="translate(24,151)" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4 L12 12"/>
        <path d="M12 4 L4 12"/>
      </g>
      <text x="50" y="164" font-size="18" font-weight="400" fill="#C7D4CF">录音、代接挂断电话</text>

      <g transform="translate(24,191)" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4 L12 12"/>
        <path d="M12 4 L4 12"/>
      </g>
      <text x="50" y="204" font-size="18" font-weight="400" fill="#C7D4CF">翻你密码与验证码</text>
    </g>

    <!-- 底部：配额与熔断 -->
    <text x="600" y="384" text-anchor="middle" font-size="18" font-weight="400" fill="#7E918C">存储配额超限直接拒绝，不静默覆写 · 不占系统 VPN 槽位 · 可一键熔断</text>
  </g>
</svg>
