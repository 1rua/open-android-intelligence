<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">决定权永远在你的手机上：四步权限把关与安全红线</title>
  <desc id="desc">左边展示 AI 调用手机时的四步把关：AI 提出申请、手机检查本地开关、你在屏幕上点头确认、执行并记账；右边黑底面板列出系统永远不会做的四件事。</desc>

  <defs>
    <pattern id="secGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#111111" opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", ui-monospace, monospace; font-size: 18px; letter-spacing: 0.4px; fill: #4A4A46; }
    .mono-d { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", ui-monospace, monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; fill: #111111; }
    .num { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", ui-monospace, monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.8px; fill: #B8501F; }
    .disp { font-family: "Arial Black", "Inter", "Helvetica Neue", Arial, "PingFang SC", "Noto Sans CJK SC", sans-serif; font-weight: 900; font-size: 40px; letter-spacing: -0.6px; fill: #111111; }
    .stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 20px; font-weight: 800; fill: #111111; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: 400; fill: #4A4A46; }
    .neg-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 21px; font-weight: 800; fill: #F7F7F5; }
    .neg-b { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: 400; fill: #E4E4DE; }
  </style>

  <rect width="1200" height="460" rx="20" fill="#F7F7F5"/>
  <rect width="1200" height="460" rx="20" fill="url(#secGrid)"/>
  <rect x="20" y="20" width="1160" height="420" fill="none" stroke="#111111" stroke-width="1.4"/>

  <g stroke="#111111" stroke-width="1.2">
    <path d="M10 20H30M20 10V30"/>
    <path d="M1170 20H1190M1180 10V30"/>
    <path d="M10 440H30M20 430V450"/>
    <path d="M1170 440H1190M1180 430V450"/>
  </g>

  <text x="44" y="48" class="mono-d">PRIVACY &amp; CONTROL / 为什么不怕 AI 乱动你的手机？</text>
  <text x="1156" y="48" class="mono" text-anchor="end">不需要 Root · 默认每次手动确认</text>
  <path d="M44 64H1156" stroke="#111111" stroke-width="1.2"/>

  <text x="44" y="114" class="disp">决定权永远在你的手机上</text>
  <text x="44" y="146" class="body">换了服务端、换了账号或换了 AI 助手，你在手机上设置的权限开关都不会被重置或绕过。</text>
  <path d="M44 168H1156" stroke="#111111" stroke-width="1.2"/>

  <!-- 左侧四步把关框 -->
  <rect x="44" y="188" width="744" height="204" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/>
  <rect x="44" y="188" width="744" height="46" fill="#EFEFE9" stroke="#111111" stroke-width="1.2"/>
  <text x="60" y="217" class="mono-d">AI 每次调用手机功能时的四道关卡</text>
  <path d="M230 234V392M416 234V392M602 234V392" stroke="#D6D6CE" stroke-width="1"/>

  <text x="60" y="266" class="num">01 / 提申请</text>
  <text x="60" y="298" class="stage">AI 报上名来</text>
  <text x="60" y="330" class="body">写明是哪个助手</text>
  <text x="60" y="358" class="body">这次要做什么事</text>

  <text x="246" y="266" class="num">02 / 查开关</text>
  <text x="246" y="298" class="stage">手机先查规则</text>
  <text x="246" y="330" class="body">检查插件总开关</text>
  <text x="246" y="358" class="body">核对允许的范围</text>

  <text x="432" y="266" class="num">03 / 你拍板</text>
  <text x="432" y="298" class="stage">手机弹窗问你</text>
  <text x="432" y="330" class="body">拒绝或仅本次允许</text>
  <text x="432" y="358" class="body">或允许 5–60 分钟</text>

  <text x="618" y="266" class="num">04 / 留账本</text>
  <text x="618" y="298" class="stage">执行并记一笔</text>
  <text x="618" y="330" class="body">结果写入手机账本</text>
  <text x="618" y="358" class="body">随时撤回或停用</text>

  <!-- 右侧反白禁令框 -->
  <rect x="812" y="188" width="344" height="204" fill="#111111"/>
  <text x="832" y="220" class="neg-t">永远不会做的四件事</text>
  <path d="M832 234H1136" stroke="#4A4A46" stroke-width="1"/>

  <g stroke="#D96B3F" stroke-width="2" stroke-linecap="round">
    <path d="M834 256L846 268M846 256L834 268"/>
    <path d="M834 292L846 304M846 292L834 304"/>
    <path d="M834 328L846 340M846 328L834 340"/>
    <path d="M834 364L846 376M846 364L834 376"/>
  </g>
  <text x="860" y="268" class="neg-b">不开放远程命令行 (Root Shell)</text>
  <text x="860" y="304" class="neg-b">不在后台偷翻你的相册和文件</text>
  <text x="860" y="340" class="neg-b">不录音、不代接或挂断你的电话</text>
  <text x="860" y="376" class="neg-b">不绕过确认替你偷偷发短信</text>

  <path d="M44 408H1156" stroke="#111111" stroke-width="1.2"/>
  <text x="44" y="430" class="body">三种模式随心选：每次手动确认（默认） · 只允许读取 · 自动允许（主动推送默认关闭，需单独勾选）</text>
</svg>
