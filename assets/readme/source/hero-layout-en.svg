<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Open Android Intelligence — Connect your Android phone to your AI agents safely</title>
  <desc id="desc">Left side presents the project title and plain-language value proposition: chat with your AI agents from your phone, let AI help with messages and screen actions, and keep every permission decision on your phone. Right side holds the tactile Android handset and orbital node illustration.</desc>

  <defs>
    <pattern id="heroDotGridEn" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#111111" opacity="0.08"/>
    </pattern>
    <clipPath id="rightPanelClipEn">
      <rect x="700" y="64" width="456" height="296"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", ui-monospace, monospace; font-size: 18px; letter-spacing: 0.4px; fill: #4A4A46; }
    .mono-dark { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", ui-monospace, monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; fill: #111111; }
    .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #B8501F; }
    .disp { font-family: "Arial Black", "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 60px; letter-spacing: -1.5px; fill: #111111; }
    .lede { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #111111; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #4A4A46; }
    .tag-num { font-family: "JetBrains Mono", "Roboto Mono", "DejaVu Sans Mono", ui-monospace, monospace; font-size: 18px; font-weight: 700; fill: #B8501F; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #111111; }
  </style>

  <rect width="1200" height="420" rx="20" fill="#F7F7F5"/>
  <rect width="1200" height="420" rx="20" fill="url(#heroDotGridEn)"/>
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#111111" stroke-width="1.4"/>

  <g stroke="#111111" stroke-width="1.2">
    <path d="M10 20H30M20 10V30"/>
    <path d="M1170 20H1190M1180 10V30"/>
    <path d="M10 400H30M20 390V410"/>
    <path d="M1170 400H1190M1180 390V410"/>
  </g>

  <text x="44" y="48" class="mono-dark">OPEN ANDROID INTELLIGENCE (OAI)</text>
  <text x="680" y="48" class="mono" text-anchor="end">SELF-HOSTED · NO ROOT</text>
  <text x="1156" y="48" class="mono" text-anchor="end">ANDROID 12+ · PYTHON 3.11+</text>
  <path d="M44 64H1156" stroke="#111111" stroke-width="1.2"/>
  <path d="M700 64V360" stroke="#111111" stroke-width="1.2"/>
  <path d="M44 360H1156" stroke="#111111" stroke-width="1.2"/>

  <g id="title-block">
    <text x="44" y="98" class="eyebrow">ONE ANDROID APP · MULTIPLE AI AGENTS · PHONE-SIDE CONTROL</text>
    <text x="42" y="162" class="disp">Open Android</text>
    <text x="42" y="224" class="disp">Intelligence</text>
    <rect x="44" y="240" width="64" height="5" fill="#B8501F"/>

    <text x="44" y="276" class="lede">Chat with your AI agents &amp; let them use your phone safely</text>
    <text x="44" y="306" class="body">Direct link to your server — notifications, SMS &amp; screen stay in your hands</text>

    <path d="M44 322H676" stroke="#D6D6CE" stroke-width="1"/>

    <text x="44" y="348" class="tag-num">01</text>
    <text x="72" y="348" class="tag-text">Chat with Agents</text>

    <text x="256" y="348" class="tag-num">02</text>
    <text x="284" y="348" class="tag-text">Read &amp; Act</text>

    <text x="420" y="348" class="tag-num">03</text>
    <text x="448" y="348" class="tag-text">Approve on Screen</text>
  </g>

  <g id="right-backdrop" clip-path="url(#rightPanelClipEn)">
    <rect x="701" y="65" width="454" height="294" fill="#EFEFE9" opacity="0.55"/>
    <path d="M700 212H1156" stroke="#D6D6CE" stroke-width="0.9" stroke-dasharray="4 6"/>
    <path d="M928 64V360" stroke="#D6D6CE" stroke-width="0.9" stroke-dasharray="4 6"/>
    <circle cx="928" cy="212" r="126" fill="none" stroke="#D6D6CE" stroke-width="1"/>
    <circle cx="928" cy="212" r="92" fill="none" stroke="#C9C9C2" stroke-width="0.9" stroke-dasharray="3 6"/>
    <ellipse cx="928" cy="212" rx="188" ry="58" fill="none" stroke="#111111" stroke-width="1.2" opacity="0.35" transform="rotate(-17 928 212)"/>
  </g>

  <g id="hero-subject-slot" transform="translate(716 68)">
  </g>

  <text x="44" y="386" class="mono-dark">Android Phone  ⇄  OAI Core (Your Server)  ⇄  Hermes / DSH / Codex / Claude</text>
  <text x="1156" y="386" class="mono" text-anchor="end">MIT LICENSE</text>
</svg>
