    <text x="384" y="382" class="body">设备 CLI / API / MCP</text>

    <text x="384" y="414" class="mono-d">V2 /AGENTS</text>
    <text x="384" y="438" class="body">原生 Agent 会话流</text>

    <text x="384" y="470" class="mono-d">IDEMPOTENT</text>
