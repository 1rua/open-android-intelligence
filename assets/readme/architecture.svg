<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="auto" role="img" aria-label="架构：手机侧裁决、协议层校验、服务器侧思考">
  <title>三层结构，一条加密链路</title>
  <desc>手机上是 Android 宿主、平台内核与设备插件；中间是 Gateway Protocol v2 的加密链路；服务器上是 Hermes 或 OpenClaw 的原生插件与模型。</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08110E"/>
      <stop offset="1" stop-color="#0D1A15"/>
    </linearGradient>
    <radialGradient id="archGlowMint" gradientUnits="userSpaceOnUse" cx="240" cy="120" r="320">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="archGlowSky" gradientUnits="userSpaceOnUse" cx="960" cy="440" r="340">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="archDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#34D399"/>
    </pattern>
    <clipPath id="archClip">
      <rect width="1200" height="560" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .h-title { font-size: 26px; font-weight: 700; fill: #F3F7F5; }
    .h-sub   { font-size: 20px; font-weight: 400; fill: #9DB0AA; }
    .col-title { font-size: 22px; font-weight: 700; fill: #F3F7F5; }
    .col-sub   { font-size: 19px; font-weight: 400; fill: #7E918C; }
    .item-title { font-size: 20px; font-weight: 600; fill: #F3F7F5; }
    .item-desc  { font-size: 19px; font-weight: 400; fill: #9DB0AA; }
    .proto-item { font-size: 19px; font-weight: 500; fill: #C7D4CF; }
    .foot       { font-size: 18px; font-weight: 400; fill: #7E918C; }
  </style>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <!-- 画布 -->
    <rect width="1200" height="560" rx="20" fill="url(#archBg)"/>
    <g clip-path="url(#archClip)">
      <rect width="1200" height="560" fill="url(#archDots)" opacity="0.03"/>
      <circle cx="240" cy="120" r="320" fill="url(#archGlowMint)" opacity="0.05"/>
      <circle cx="960" cy="440" r="340" fill="url(#archGlowSky)" opacity="0.05"/>
    </g>

    <!-- 标题 -->
    <text x="64" y="58" class="h-title">三层结构，一条加密链路</text>
    <text x="64" y="90" class="h-sub">手机上裁决 · 协议里校验 · 服务器上思考</text>

    <!-- 第一列：手机上 -->
    <g transform="translate(64,120)">
      <rect width="330" height="360" rx="20" fill="#101C17" stroke="#22382F" stroke-width="1.5"/>
      <rect x="16" y="16" width="298" height="44" rx="22" fill="#16281F" stroke="#2E4A3E" stroke-width="1"/>
      <text x="36" y="46" class="col-title">手机上</text>
      <text x="24" y="88" class="col-sub">Android 宿主</text>

      <!-- 条目 1：你来操作 -->
      <g transform="translate(24,114)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2.5"/>
        <path d="M9 18.5h6"/>
      </g>
      <text x="60" y="132" class="item-title">你来操作</text>
      <text x="60" y="158" class="item-desc">连网关、多会话聊天、挑附件</text>

      <!-- 条目 2：平台内核 -->
      <g transform="translate(24,194)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 21 5.4v5.2c0 4.6-3.6 8.2-9 9.4-5.4-1.2-9-4.8-9-9.4V5.4L12 2Z"/>
        <path d="M8.4 11.6l2.6 2.6 4.6-4.8"/>
      </g>
      <text x="60" y="212" class="item-title">平台内核</text>
      <text x="60" y="238" class="item-desc">管身份、裁决权限、启停插件</text>

      <!-- 条目 3：设备插件 -->
      <g transform="translate(24,274)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16v7.2h-2.2a2.6 2.6 0 0 0 0 5.2H20V20H4v-3.6h2.2a2.6 2.6 0 0 0 0-5.2H4V4Z"/>
      </g>
      <text x="60" y="292" class="item-title">设备插件</text>
      <text x="60" y="318" class="item-desc">短信、通知、通话记录按需装</text>
    </g>

    <!-- 列间箭头 1 -->
    <path d="M398 300h20" stroke="#3C6657" stroke-width="2" stroke-linecap="round"/>
    <polygon points="418,294 418,306 427,300" fill="#34D399"/>

    <!-- 第二列：中间 -->
    <g transform="translate(430,120)">
      <rect width="270" height="360" rx="20" fill="#101C17" stroke="#22382F" stroke-width="1.5"/>
      <rect x="16" y="16" width="238" height="44" rx="22" fill="#16281F" stroke="#2E4A3E" stroke-width="1"/>
      <text x="36" y="46" class="col-title">中间</text>
      <text x="24" y="88" class="col-sub">Gateway Protocol v2</text>

      <g stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none">
        <circle cx="32" cy="122" r="3.4" fill="#38BDF8" stroke="none"/>
        <circle cx="32" cy="178" r="3.4" fill="#38BDF8" stroke="none"/>
        <circle cx="32" cy="234" r="3.4" fill="#38BDF8" stroke="none"/>
        <circle cx="32" cy="290" r="3.4" fill="#38BDF8" stroke="none"/>
        <path d="M32 132v34M32 188v34M32 244v34" stroke-opacity="0.35"/>
      </g>
      <text x="52" y="130" class="proto-item">HTTPS + SSE 推流</text>
      <text x="52" y="186" class="proto-item">JSON Schema 全封闭</text>
      <text x="52" y="242" class="proto-item">Ed25519 签名防重放</text>
      <text x="52" y="298" class="proto-item">幂等重试不重复执行</text>

      <text x="24" y="342" class="col-sub">两端共用同一套契约</text>
    </g>

    <!-- 列间箭头 2 -->
    <path d="M704 300h20" stroke="#3C6657" stroke-width="2" stroke-linecap="round"/>
    <polygon points="724,294 724,306 733,300" fill="#38BDF8"/>

    <!-- 第三列：你的服务器上 -->
    <g transform="translate(736,120)">
      <rect width="400" height="360" rx="20" fill="#101C17" stroke="#22382F" stroke-width="1.5"/>
      <rect x="16" y="16" width="368" height="44" rx="22" fill="#16281F" stroke="#2E4A3E" stroke-width="1"/>
      <text x="36" y="46" class="col-title">你的服务器上</text>
      <text x="24" y="88" class="col-sub">Agent 宿主</text>

      <!-- 条目 1：原生插件 -->
      <g transform="translate(24,114)" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="8" rx="2"/>
        <rect x="3" y="13" width="18" height="8" rx="2"/>
        <path d="M7 7h2M7 17h2"/>
      </g>
      <text x="60" y="132" class="item-title">原生插件</text>
      <text x="60" y="158" class="item-desc">直接加载，不用另跑 Docker Bridge</text>

      <!-- 条目 2：多账号隔离 -->
      <g transform="translate(24,194)" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="7.5" r="4"/>
        <path d="M4 20c0-3.8 3.6-6.5 8-6.5s8 2.7 8 6.5"/>
      </g>
      <text x="60" y="212" class="item-title">多账号隔离</text>
      <text x="60" y="238" class="item-desc">配对、会话、记忆各归各</text>

      <!-- 条目 3：模型与工具 -->
      <g transform="translate(24,274)" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="12" height="12" rx="2.5"/>
        <path d="M10 2v4M14 2v4M10 18v4M14 18v4M2 10h4M2 14h4M18 10h4M18 14h4"/>
      </g>
      <text x="60" y="292" class="item-title">模型与工具</text>
      <text x="60" y="318" class="item-desc">都跑在你自己机器上</text>
    </g>

    <!-- 底部说明 -->
    <text x="600" y="524" text-anchor="middle" class="foot">请求从手机发到服务器，事件从服务器推回手机 · 70 组契约向量两端对齐 · 设备执行链路仍在装配</text>
  </g>
</svg>
