    <text x="1140" y="368" class="mono-m" text-anchor="end">BRIDGE / 8791</text>
    <path d="M632 384H1140" stroke="#D6D6CE" stroke-width="0.8"/>

    <text x="632" y="422" class="num">03</text>
    <text x="664" y="422" class="host">CODEX</text>
    <text x="764" y="422" class="body">app-server / 实例目录</text>
