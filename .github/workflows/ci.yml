name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a failed run be reproduced on demand instead of waiting for the next
  # push, which matters when a failure only reproduces in CI.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gateway-and-protocol:
    name: Protocol Conformance & Historical Gateway Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The contract pin gate compares the pinned commit against this one,
          # so the history it references must be present; a shallow clone would
          # make the gate silently skip itself.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
          npm ci --prefix plugin-tooling
          python -m pip install pytest

      # Historical protocol oracle only: the fixed pre-migration Gateway below
      # is never an OAI Core runtime dependency. Its package lives in a separate
      # virtualenv. Current Core independence and the optional Session Adapter
      # are validated by oai-core.yml without installing this legacy package.
      - name: Check out the historical Hermes Gateway fixture
        uses: actions/checkout@v4
        with:
          repository: 1rua/hermes-android-gateway
          # 历史协议兼容基线；不得随当前 Session Adapter 分支漂移。
          ref: ebe527da2426dd25877dd335786e80cf85d1cdde
          path: .hermes-gateway-plugin

      - name: Install the historical fixture in its isolated virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/legacy-hermes-fixture"
          "$RUNNER_TEMP/legacy-hermes-fixture/bin/python" -m pip install -e .hermes-gateway-plugin \
            pytest aiohttp PyYAML==6.0.3 httpx==0.28.1 python-dotenv==1.2.4 psutil==7.2.2

      # 只加载当前两处宿主的原生存储/平台 API；测试不调用真实模型。
      - name: Check out the pinned Hermes native SDK
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 75b083e9399115b12513385252811f09c3503c90
          path: .toolchains/hermes-native-sdk

      - name: Resolve the OpenClaw plugin pin
        id: openclaw-pin
        run: |
          revision=$(python3 -c "import json;print(json.load(open('openclaw-plugin-pin.json'))['revision'])")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out the OpenClaw Gateway plugin
        uses: actions/checkout@v4
        with:
          repository: 1rua/openclaw-gateway-plugin
          ref: ${{ steps.openclaw-pin.outputs.revision }}
          path: .openclaw-gateway-plugin

      - name: Install the OpenClaw Gateway plugin dependencies
        run: npm ci --prefix .openclaw-gateway-plugin --ignore-scripts

      - name: Check archived Gateway backport tooling
        run: |
          python -m unittest discover -s gateway-contract/patches/session-recovery -p 'test_*.py'
          python -m unittest discover -s gateway-contract/patches/conversation-management -p 'test_*.py'

      - name: Verify App release metadata
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s apps/android/tools -p 'test_app_release_metadata.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s apps/android/tools -p 'test_extract_package_version.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s apps/android/tools -p 'test_prepare_release_notes.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s apps/android/tools -p 'test_bundled_plugins.py'

      # The plugin packages a contract snapshot generated from a pinned commit.
      # Compare all contract inputs (source, schemas, registry and vectors)
      # rather than commit identity, so unrelated app commits need no plugin bump.
      - name: Verify the plugin pins this commit's contract
        run: |
          python gateway-contract/tools/check-contract-pin.py --plugin-root-env HERMES_PLUGIN_ROOT
          python gateway-contract/tools/check-contract-pin.py --plugin-root-env OPENCLAW_PLUGIN_ROOT
          python -m pytest -q gateway-contract/tools/test_check_contract_pin.py
          python tools/check-openclaw-plugin-pin.py
          npm --prefix .openclaw-gateway-plugin run contract:check
        env:
          HERMES_PLUGIN_ROOT: ${{ github.workspace }}/.hermes-gateway-plugin
          OPENCLAW_PLUGIN_ROOT: ${{ github.workspace }}/.openclaw-gateway-plugin
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT: ${{ github.workspace }}/gateway-contract

      - name: Verify dependency lock
        run: npm run lock:check

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck --prefix .openclaw-gateway-plugin
          python gateway-contract/patches/conversation-management/runtime-build-manifest.py \
            --runtime-root .openclaw-gateway-plugin/runtime --write "$RUNNER_TEMP/oai-runtime-reviewed.json"
          npm run build --prefix .openclaw-gateway-plugin
          python gateway-contract/patches/conversation-management/runtime-build-manifest.py \
            --runtime-root .openclaw-gateway-plugin/runtime --compare "$RUNNER_TEMP/oai-runtime-reviewed.json"
          npm run build --prefix .openclaw-gateway-plugin
          python gateway-contract/patches/conversation-management/runtime-build-manifest.py \
            --runtime-root .openclaw-gateway-plugin/runtime --compare "$RUNNER_TEMP/oai-runtime-reviewed.json"

      - name: Gateway v2 Cross-Host Conformance
        env:
          OPENCLAW_PLUGIN_ROOT: ${{ github.workspace }}/.openclaw-gateway-plugin
        run: PATH="$RUNNER_TEMP/legacy-hermes-fixture/bin:$PATH" npm run gateway:v2:conformance

      - name: Historical Gateway compatibility regressions
        env:
          OPENCLAW_PLUGIN_ROOT: ${{ github.workspace }}/.openclaw-gateway-plugin
          HERMES_SDK_ROOT: ${{ github.workspace }}/.toolchains/hermes-native-sdk
          HERMES_HOME: ${{ runner.temp }}/oai-native-hermes-ci
          HERMES_TEST_ISOLATION: ${{ runner.temp }}/oai-native-hermes-ci
        run: |
          PATH="$RUNNER_TEMP/legacy-hermes-fixture/bin:$PATH" npm test
          # Native SDK imports alter process-wide host registries. Keep fake-host
          # tests isolated; the next step runs the real SDK/HTTP fixtures.
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT="$PWD/gateway-contract" \
            env -u HERMES_SDK_ROOT -u PYTHONPATH "$RUNNER_TEMP/legacy-hermes-fixture/bin/python" -m pytest .hermes-gateway-plugin/tests \
              --ignore=.hermes-gateway-plugin/tests/test_native_history_complete.py \
              --ignore=.hermes-gateway-plugin/tests/test_native_history_projection.py \
              --ignore=.hermes-gateway-plugin/tests/test_native_streaming_delivery.py \
              --ignore=.hermes-gateway-plugin/tests/test_native_turn_lifecycle.py \
              --ignore=.hermes-gateway-plugin/tests/test_native_turn_review_boundaries.py \
              --ignore=.hermes-gateway-plugin/tests/test_native_binding_http_failures.py \
              --ignore=.hermes-gateway-plugin/tests/test_conversation_management.py \
              --ignore=.hermes-gateway-plugin/tests/test_host_command_catalog.py \
              --ignore=.hermes-gateway-plugin/tests/test_android_echo_fixture.py

      - name: Historical Hermes SDK history and transport compatibility
        # 正常矩阵约数十秒；停滞时保留具体用例与调用栈，避免无限占用流水线。
        timeout-minutes: 5
        env:
          HERMES_SDK_ROOT: ${{ github.workspace }}/.toolchains/hermes-native-sdk
          PYTHONPATH: ${{ github.workspace }}/.toolchains/hermes-native-sdk
          HERMES_HOME: ${{ runner.temp }}/oai-native-hermes-regression
          HERMES_TEST_ISOLATION: ${{ runner.temp }}/oai-native-hermes-regression
          OAI_REQUIRE_NATIVE_HERMES: "1"
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT: ${{ github.workspace }}/gateway-contract
        run: |
          "$RUNNER_TEMP/legacy-hermes-fixture/bin/python" -m pytest -vv -o faulthandler_timeout=30 \
            .hermes-gateway-plugin/tests/test_native_history_complete.py \
            .hermes-gateway-plugin/tests/test_native_history_projection.py \
            .hermes-gateway-plugin/tests/test_native_streaming_delivery.py \
            .hermes-gateway-plugin/tests/test_native_turn_lifecycle.py \
            .hermes-gateway-plugin/tests/test_native_turn_review_boundaries.py \
            .hermes-gateway-plugin/tests/test_conversation_management.py \
            .hermes-gateway-plugin/tests/test_host_command_catalog.py \
            .hermes-gateway-plugin/tests/test_native_binding_http_failures.py \
            .hermes-gateway-plugin/tests/test_legacy_conversation_canonical.py \
            .hermes-gateway-plugin/tests/test_android_echo_fixture.py

  android:
    name: Android Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # APK 的版本顺序来自完整提交历史，须与发布工作流一致。
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

      # HermesHttpInteropTest preserves historical /conversations HTTP behavior.
      # Keep this fixed old fixture isolated from the new Core package: this
      # compatibility lane does not prove the new Core/Android deployment.
      - name: Checkout the historical Hermes HTTP fixture
        uses: actions/checkout@v4
        with:
          repository: 1rua/hermes-android-gateway
          ref: ebe527da2426dd25877dd335786e80cf85d1cdde
          path: .hermes-gateway-plugin

      - name: Resolve the Android fixture OpenClaw pin
        id: android-openclaw-pin
        run: |
          revision=$(python3 -c "import json;print(json.load(open('openclaw-plugin-pin.json'))['revision'])")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out the Android fixture OpenClaw plugin
        uses: actions/checkout@v4
        with:
          repository: 1rua/openclaw-gateway-plugin
          ref: ${{ steps.android-openclaw-pin.outputs.revision }}
          path: .openclaw-gateway-plugin

      - name: Check out the pinned Hermes native SDK
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 75b083e9399115b12513385252811f09c3503c90
          path: .toolchains/hermes-native-sdk

      - name: Set up Python for the Gateway fixture
        uses: actions/setup-python@v5
        with:
          # The interpreter Hermes Agent ships, matching the plugin runtime.
          python-version: "3.11"

      # Only the archived HTTP fixture can import this environment. The current
      # Core wheel and optional Adapter use the independent oai-core.yml jobs.
      - name: Install the historical HTTP fixture in an isolated virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/legacy-hermes-fixture"
          "$RUNNER_TEMP/legacy-hermes-fixture/bin/python" -m pip install .hermes-gateway-plugin \
            aiohttp PyYAML==6.0.3 httpx==0.28.1 python-dotenv==1.2.4 psutil==7.2.2

      - name: Build real Rust WASM plugins for Android runtime regression
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.90.0 build --target wasm32-unknown-unknown --release --manifest-path plugins/Cargo.toml

      - name: Setup Node.js for notification delivery tests
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: plugin-tooling/package-lock.json

      # PR 场景没有生产私钥，这里用一次性随机 seed 作隔离测试作者，
      # 一次性签出数据读取与屏幕能力六个包供 APK 内置校验使用。
      - name: Build signed plugin packages with an isolated test author
        run: |
          npm ci --prefix plugin-tooling
          umask 077
          OAI_PLUGIN_KEY_FILE="$RUNNER_TEMP/oai-test-plugin-seed.bin"
          trap 'if [ -f "$OAI_PLUGIN_KEY_FILE" ]; then mkdir -p "$RUNNER_TEMP/open-android-intelligence-trash"; mv "$OAI_PLUGIN_KEY_FILE" "$RUNNER_TEMP/open-android-intelligence-trash/oai-test-plugin-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"; fi' EXIT
          python3 -c 'import secrets,sys;open(sys.argv[1],"wb").write(secrets.token_bytes(32))' "$OAI_PLUGIN_KEY_FILE"
          mkdir -p "$RUNNER_TEMP/signed-plugins"
          OPEN_ANDROID_INTELLIGENCE_PLUGIN_SIGNING_KEY_FILE="$OAI_PLUGIN_KEY_FILE" \
            npm run build:android-plugins --prefix plugin-tooling -- "$RUNNER_TEMP/signed-plugins"
          echo "OAI_BUNDLED_PLUGINS_DIR=$RUNNER_TEMP/signed-plugins" >> "$GITHUB_ENV"

      - name: Run Android Tasks
        working-directory: apps/android
        env:
          LC_ALL: C.UTF-8
          HERMES_PLUGIN_ROOT: ${{ github.workspace }}/.hermes-gateway-plugin
          HERMES_SDK_ROOT: ${{ github.workspace }}/.toolchains/hermes-native-sdk
          # This repository owns the contract; the plugin is pointed at it
          # rather than fetching its own pinned copy during a test run.
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT: ${{ github.workspace }}/gateway-contract
        run: |
          chmod +x gradlew
          export PATH="$RUNNER_TEMP/legacy-hermes-fixture/bin:$PATH"
          ./gradlew check :app:assembleFullDebug -Poai.requireBundledPlugins=true --stacktrace --max-workers=2

      # 六个插件资产必须逐一与签出的包逐字节一致；缺一个就说明内置链路断了。
      - name: Verify the plugin packages reached the APK
        run: |
          for package in notifications sms call-log screen-reader screen-capture screen-control; do
            python3 apps/android/tools/verify_bundled_plugins.py \
              --apk apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk \
              --package "$package=$OAI_BUNDLED_PLUGINS_DIR/$package.alp"
          done
