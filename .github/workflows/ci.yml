name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a failed run be reproduced on demand instead of waiting for the next
  # push, which matters when a failure only reproduces in CI.
  workflow_dispatch:

jobs:
  gateway-and-protocol:
    name: Node.js & Gateway Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The contract pin gate compares the pinned commit against this one,
          # so the history it references must be present; a shallow clone would
          # make the gate silently skip itself.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
          npm ci --prefix plugin-tooling
          python -m pip install pytest aiohttp jsonschema cryptography PyYAML==6.0.3 httpx==0.28.1 python-dotenv==1.2.4 psutil==7.2.2

      # The Hermes Gateway lives in its own repository and is consumed as an
      # installed package; this repository stays the authoritative source of the
      # Gateway Protocol contract that both sides validate against.
      - name: Check out the Hermes Gateway plugin
        uses: actions/checkout@v4
        with:
          repository: 1rua/hermes-gateway-plugin
          # 固定配套的宿主桥接修复，保证联调不会随插件 main 漂移。
          ref: 3b113cadc0526f0475233e7c41790d4a8fdd9fc7
          path: .hermes-gateway-plugin

      - name: Install the Hermes Gateway plugin
        run: python -m pip install -e .hermes-gateway-plugin

      # 只加载当前两处宿主的原生存储/平台 API；测试不调用真实模型。
      - name: Check out the pinned Hermes native SDK
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 75b083e9399115b12513385252811f09c3503c90
          path: .toolchains/hermes-native-sdk

      - name: Resolve the OpenClaw plugin pin
        id: openclaw-pin
        run: |
          revision=$(python3 -c "import json;print(json.load(open('openclaw-plugin-pin.json'))['revision'])")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out the OpenClaw Gateway plugin
        uses: actions/checkout@v4
        with:
          repository: 1rua/openclaw-gateway-plugin
          ref: ${{ steps.openclaw-pin.outputs.revision }}
          path: .openclaw-gateway-plugin

      - name: Install the OpenClaw Gateway plugin dependencies
        run: npm ci --prefix .openclaw-gateway-plugin --ignore-scripts

      - name: Apply reviewed native conversation management patches
        run: |
          python -m unittest discover -s gateway-contract/patches/conversation-management -p 'test_*.py'
          python gateway-contract/patches/conversation-management/apply-gateway-patches.py \
            --openclaw-root .openclaw-gateway-plugin --hermes-root .hermes-gateway-plugin --apply

      # The plugin packages a contract snapshot generated from a pinned commit.
      # Compare all contract inputs (source, schemas, registry and vectors)
      # rather than commit identity, so unrelated app commits need no plugin bump.
      - name: Verify the plugin pins this commit's contract
        run: |
          python gateway-contract/tools/check-contract-pin.py --plugin-root-env HERMES_PLUGIN_ROOT
          python gateway-contract/tools/check-contract-pin.py --plugin-root-env OPENCLAW_PLUGIN_ROOT
          python tools/check-openclaw-plugin-pin.py
          npm --prefix .openclaw-gateway-plugin run contract:check
        env:
          HERMES_PLUGIN_ROOT: ${{ github.workspace }}/.hermes-gateway-plugin
          OPENCLAW_PLUGIN_ROOT: ${{ github.workspace }}/.openclaw-gateway-plugin
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT: ${{ github.workspace }}/gateway-contract

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck --prefix .openclaw-gateway-plugin
          python gateway-contract/patches/conversation-management/runtime-build-manifest.py \
            --runtime-root .openclaw-gateway-plugin/runtime --write "$RUNNER_TEMP/oai-runtime-reviewed.json"
          npm run build --prefix .openclaw-gateway-plugin
          python gateway-contract/patches/conversation-management/runtime-build-manifest.py \
            --runtime-root .openclaw-gateway-plugin/runtime --compare "$RUNNER_TEMP/oai-runtime-reviewed.json"
          npm run build --prefix .openclaw-gateway-plugin
          python gateway-contract/patches/conversation-management/runtime-build-manifest.py \
            --runtime-root .openclaw-gateway-plugin/runtime --compare "$RUNNER_TEMP/oai-runtime-reviewed.json"
          npm run typecheck --prefix plugin-tooling

      - name: Gateway v2 Cross-Host Conformance
        env:
          OPENCLAW_PLUGIN_ROOT: ${{ github.workspace }}/.openclaw-gateway-plugin
        run: npm run gateway:v2:conformance

      - name: Run Gateway Tests
        env:
          OPENCLAW_PLUGIN_ROOT: ${{ github.workspace }}/.openclaw-gateway-plugin
          HERMES_SDK_ROOT: ${{ github.workspace }}/.toolchains/hermes-native-sdk
          HERMES_HOME: ${{ runner.temp }}/oai-native-hermes-ci
          HERMES_TEST_ISOLATION: ${{ runner.temp }}/oai-native-hermes-ci
        run: |
          npm test
          npm test --prefix plugin-tooling
          # Native SDK imports alter process-wide host registries. Keep fake-host
          # tests isolated; the next step runs the real SDK/HTTP fixtures.
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT="$PWD/gateway-contract" \
            env -u HERMES_SDK_ROOT -u PYTHONPATH python -m pytest .hermes-gateway-plugin/tests \
              --ignore=.hermes-gateway-plugin/tests/test_native_history_complete.py \
              --ignore=.hermes-gateway-plugin/tests/test_native_history_projection.py \
              --ignore=.hermes-gateway-plugin/tests/test_native_streaming_delivery.py \
              --ignore=.hermes-gateway-plugin/tests/test_android_echo_fixture.py

      - name: Verify the real Hermes native history and transports
        # 正常矩阵约数十秒；停滞时保留具体用例与调用栈，避免无限占用流水线。
        timeout-minutes: 5
        env:
          HERMES_SDK_ROOT: ${{ github.workspace }}/.toolchains/hermes-native-sdk
          PYTHONPATH: ${{ github.workspace }}/.toolchains/hermes-native-sdk
          HERMES_HOME: ${{ runner.temp }}/oai-native-hermes-regression
          HERMES_TEST_ISOLATION: ${{ runner.temp }}/oai-native-hermes-regression
          OAI_REQUIRE_NATIVE_HERMES: "1"
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT: ${{ github.workspace }}/gateway-contract
        run: |
          python -m pytest -vv -o faulthandler_timeout=30 \
            .hermes-gateway-plugin/tests/test_native_history_complete.py \
            .hermes-gateway-plugin/tests/test_native_history_projection.py \
            .hermes-gateway-plugin/tests/test_native_streaming_delivery.py \
            .hermes-gateway-plugin/tests/test_native_turn_lifecycle.py \
            .hermes-gateway-plugin/tests/test_native_turn_review_boundaries.py \
            .hermes-gateway-plugin/tests/test_conversation_management.py \
            .hermes-gateway-plugin/tests/test_host_command_catalog.py \
            .hermes-gateway-plugin/tests/test_native_binding_http_failures.py \
            .hermes-gateway-plugin/tests/test_legacy_conversation_canonical.py \
            .hermes-gateway-plugin/tests/test_android_echo_fixture.py

  android:
    name: Android Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # HermesHttpInteropTest starts the real Gateway from the plugin checkout
      # and drives it over HTTP. Without these it fails loudly rather than
      # silently skipping the only cross-language contract evidence we have.
      - name: Checkout the Hermes Gateway plugin
        uses: actions/checkout@v4
        with:
          repository: 1rua/hermes-gateway-plugin
          ref: 3b113cadc0526f0475233e7c41790d4a8fdd9fc7
          path: .hermes-gateway-plugin

      - name: Resolve the Android fixture OpenClaw pin
        id: android-openclaw-pin
        run: |
          revision=$(python3 -c "import json;print(json.load(open('openclaw-plugin-pin.json'))['revision'])")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out the Android fixture OpenClaw plugin
        uses: actions/checkout@v4
        with:
          repository: 1rua/openclaw-gateway-plugin
          ref: ${{ steps.android-openclaw-pin.outputs.revision }}
          path: .openclaw-gateway-plugin

      - name: Apply the same reviewed Gateway patches for Android interop
        run: |
          python gateway-contract/patches/conversation-management/apply-gateway-patches.py \
            --openclaw-root .openclaw-gateway-plugin --hermes-root .hermes-gateway-plugin --apply

      - name: Check out the pinned Hermes native SDK
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 75b083e9399115b12513385252811f09c3503c90
          path: .toolchains/hermes-native-sdk

      - name: Set up Python for the Gateway fixture
        uses: actions/setup-python@v5
        with:
          # The interpreter Hermes Agent ships, matching the plugin runtime.
          python-version: "3.11"

      # 插件仍按安装包验证声明依赖；echo 夹具额外运行宿主提供的 aiohttp HTTP/SSE 入口。
      # 此任务没有安装完整 Hermes，因此显式补齐该宿主依赖。
      - name: Install the Hermes Gateway plugin for the fixture
        run: python -m pip install .hermes-gateway-plugin cryptography aiohttp PyYAML==6.0.3 httpx==0.28.1 python-dotenv==1.2.4 psutil==7.2.2

      - name: Build real Rust WASM plugins for Android runtime regression
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.90.0 build --target wasm32-unknown-unknown --release --manifest-path plugins/Cargo.toml

      - name: Run Android Tasks
        working-directory: apps/android
        env:
          LC_ALL: C.UTF-8
          HERMES_PLUGIN_ROOT: ${{ github.workspace }}/.hermes-gateway-plugin
          HERMES_SDK_ROOT: ${{ github.workspace }}/.toolchains/hermes-native-sdk
          # This repository owns the contract; the plugin is pointed at it
          # rather than fetching its own pinned copy during a test run.
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT: ${{ github.workspace }}/gateway-contract
        run: |
          chmod +x gradlew
          ./gradlew check :app:assembleFullDebug --stacktrace --no-build-cache --max-workers=1
