name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gateway-and-protocol:
    name: Node.js & Gateway Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
          npm ci --prefix plugin-tooling
          python -m pip install pytest aiohttp jsonschema cryptography

      - name: Typecheck
        run: |
          npm run typecheck
          npx tsc -p tsconfig.openclaw.json
          npm run typecheck --prefix plugin-tooling

      - name: Gateway v2 Cross-Host Conformance
        run: npm run gateway:v2:conformance

      - name: Run Gateway Tests
        run: |
          npm test
          npm test --prefix plugin-tooling
          python -m pytest integrations/hermes/tests

  android:
    name: Android Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Tasks
        working-directory: apps/android
        env:
          LC_ALL: C.UTF-8
        run: |
          chmod +x gradlew
          ./gradlew check :app:assembleFullDebug --stacktrace
