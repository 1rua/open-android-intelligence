name: Stable Release

# 合并后只检出已进入目标分支的提交；未合并 PR 不进入正式发布流程。
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dev-release
  cancel-in-progress: false
  queue: max

jobs:
  sign-notification-package:
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signed-artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # 仅在合并门禁通过后检出已进入目标分支的提交。
          allow-unsafe-pr-checkout: true

      - name: Setup Node.js for signed device packages
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: plugin-tooling/package-lock.json

      - name: Build the notification plugin WASM
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.90.0 build --locked --target wasm32-unknown-unknown --release --manifest-path plugins/Cargo.toml -p open-android-intelligence-notifications
          npm ci --prefix plugin-tooling

      - name: Sign the bundled notification package
        env:
          OAI_PLUGIN_SIGNING_KEY_BASE64: ${{ secrets.OAI_PLUGIN_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$OAI_PLUGIN_SIGNING_KEY_BASE64" ]; then
            echo "::error::OAI_PLUGIN_SIGNING_KEY_BASE64 is required."
            exit 1
          fi
          umask 077
          OAI_PLUGIN_KEY_FILE="$RUNNER_TEMP/oai-plugin-seed.bin"
          trap 'if [ -f "$OAI_PLUGIN_KEY_FILE" ]; then mkdir -p "$RUNNER_TEMP/open-android-intelligence-trash"; mv "$OAI_PLUGIN_KEY_FILE" "$RUNNER_TEMP/open-android-intelligence-trash/oai-plugin-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"; fi' EXIT
          printf '%s' "$OAI_PLUGIN_SIGNING_KEY_BASE64" | base64 --decode > "$OAI_PLUGIN_KEY_FILE"
          OPEN_ANDROID_INTELLIGENCE_PLUGIN_SIGNING_KEY_FILE="$OAI_PLUGIN_KEY_FILE" \
            npm run build:android-notifications --prefix plugin-tooling -- "$RUNNER_TEMP/notifications.alp"

      - name: Set signed artifact name
        id: artifact-name
        run: echo "name=signed-notifications-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload the signed notification package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/notifications.alp
          if-no-files-found: error
          retention-days: 1

  build-stable-apk:
    needs: sign-notification-package
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      package-version: ${{ steps.package-version.outputs.version }}
      apk-artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # 仅在合并门禁通过后检出已进入目标分支的提交。
          allow-unsafe-pr-checkout: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract package version
        id: package-version
        run: echo "version=$(python3 apps/android/tools/extract_package_version.py --platform android)" >> "$GITHUB_OUTPUT"

      - name: Resolve version-code history commit
        id: version-code-history
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            PR_NUMBER="$PULL_REQUEST_NUMBER"
            HISTORY_SHA="$PULL_REQUEST_HEAD_SHA"
          else
            PR_INFO=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/pulls" --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last | if . == null then empty else [.number, .head.sha] | @tsv end')
            if [ -n "$PR_INFO" ]; then
              IFS=$'\t' read -r PR_NUMBER HISTORY_SHA <<< "$PR_INFO"
            else
              HISTORY_SHA="$TARGET_SHA"
            fi
          fi
          if ! [[ "$HISTORY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A full commit SHA is required to determine stable version-code history."
            exit 1
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if [ -n "$PR_NUMBER" ]; then
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::The associated pull request number is invalid."
              exit 1
            fi
            git -c http.extraheader="$AUTH_HEADER" fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
            FETCHED_HEAD=$(git rev-parse FETCH_HEAD)
            if [ "$FETCHED_HEAD" != "$HISTORY_SHA" ]; then
              echo "::error::The fetched pull request head does not match the merged source commit."
              exit 1
            fi
          else
            git cat-file -e "$HISTORY_SHA^{commit}"
          fi
          git -c http.extraheader="$AUTH_HEADER" fetch --no-tags origin "+refs/heads/dev:refs/remotes/origin/dev"
          DEV_SHA=$(git rev-parse --verify 'origin/dev^{commit}')
          echo "sha=$HISTORY_SHA" >> "$GITHUB_OUTPUT"
          echo "dev-sha=$DEV_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        run: |
          python3 apps/android/tools/app_release_metadata.py prepare \
            --channel stable \
            --history-sha "${{ steps.version-code-history.outputs.sha }}" \
            --history-sha "${{ steps.version-code-history.outputs.dev-sha }}" \
            --metadata "$RUNNER_TEMP/oai-release-metadata.json" \
            --github-env "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Download the signed notification package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign-notification-package.outputs.signed-artifact-name }}
          path: ${{ runner.temp }}/signed-notifications

      - name: Set the notification package path
        run: echo "OAI_BUNDLED_NOTIFICATIONS_ALP=$RUNNER_TEMP/signed-notifications/notifications.alp" >> "$GITHUB_ENV"

      - name: Prepare release signing key
        working-directory: apps/android
        env:
          OAI_RELEASE_KEYSTORE_BASE64: ${{ secrets.OAI_RELEASE_KEYSTORE_BASE64 }}
          OAI_RELEASE_KEYSTORE: ${{ runner.temp }}/oai-release.keystore
          OAI_RELEASE_STORE_PASSWORD: ${{ secrets.OAI_RELEASE_STORE_PASSWORD }}
          OAI_RELEASE_KEY_ALIAS: ${{ secrets.OAI_RELEASE_KEY_ALIAS }}
          OAI_RELEASE_KEY_PASSWORD: ${{ secrets.OAI_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$OAI_RELEASE_KEYSTORE_BASE64"
          test -n "$OAI_RELEASE_STORE_PASSWORD"
          test -n "$OAI_RELEASE_KEY_ALIAS"
          test -n "$OAI_RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$OAI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$OAI_RELEASE_KEYSTORE"

      - name: Build privately signed Full Release APK
        working-directory: apps/android
        env:
          OAI_RELEASE_KEYSTORE: ${{ runner.temp }}/oai-release.keystore
          OAI_RELEASE_STORE_PASSWORD: ${{ secrets.OAI_RELEASE_STORE_PASSWORD }}
          OAI_RELEASE_KEY_ALIAS: ${{ secrets.OAI_RELEASE_KEY_ALIAS }}
          OAI_RELEASE_KEY_PASSWORD: ${{ secrets.OAI_RELEASE_KEY_PASSWORD }}
        run: |
          trap 'if [ -f "$OAI_RELEASE_KEYSTORE" ]; then mkdir -p "$RUNNER_TEMP/open-android-intelligence-trash"; mv "$OAI_RELEASE_KEYSTORE" "$RUNNER_TEMP/open-android-intelligence-trash/oai-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keystore"; fi' EXIT
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease -Poai.requireBundledNotifications=true --stacktrace

      - name: Stage APK build inputs
        run: |
          mkdir -p "$RUNNER_TEMP/stable-apk-inputs"
          cp apps/android/app/build/outputs/apk/full/release/app-full-release.apk "$RUNNER_TEMP/stable-apk-inputs/"
          cp apps/android/app/build/outputs/apk/full/release/output-metadata.json "$RUNNER_TEMP/stable-apk-inputs/"
          cp "$RUNNER_TEMP/oai-release-metadata.json" "$RUNNER_TEMP/stable-apk-inputs/"
          cp "$OAI_BUNDLED_NOTIFICATIONS_ALP" "$RUNNER_TEMP/stable-apk-inputs/notifications.alp"

      - name: Set APK input artifact name
        id: artifact-name
        run: echo "name=stable-apk-inputs-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload APK build inputs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/stable-apk-inputs
          if-no-files-found: error
          retention-days: 1

  verify-stable-apk:
    needs: build-stable-apk
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      package-version: ${{ needs.build-stable-apk.outputs.package-version }}
      release-artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # 仅在合并门禁通过后检出已进入目标分支的提交。
          allow-unsafe-pr-checkout: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download APK build inputs
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-stable-apk.outputs.apk-artifact-name }}
          path: ${{ runner.temp }}/stable-apk-inputs

      - name: Verify the bundled notification package
        run: |
          python3 apps/android/tools/verify_bundled_notifications.py \
            --apk "$RUNNER_TEMP/stable-apk-inputs/app-full-release.apk" \
            --package "$RUNNER_TEMP/stable-apk-inputs/notifications.alp"

      - name: Prepare release notes from the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 apps/android/tools/prepare_release_notes.py --branch main --output "$RUNNER_TEMP/release-notes.md"

      - name: Verify APK and create update metadata
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          python3 apps/android/tools/app_release_metadata.py manifest \
            --metadata "$RUNNER_TEMP/stable-apk-inputs/oai-release-metadata.json" \
            --apk "$RUNNER_TEMP/stable-apk-inputs/app-full-release.apk" \
            --manifest "$RUNNER_TEMP/oai-update.json"
          cp "$RUNNER_TEMP/stable-apk-inputs/app-full-release.apk" "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/oai-update.json" "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-assets/"

      - name: Set stable release artifact name
        id: artifact-name
        run: echo "name=stable-release-assets-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload verified stable release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 1

  publish-stable:
    needs: [build-stable-apk, verify-stable-apk]
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          # 仅检出已合并提交；本任务不运行仓库脚本。
          allow-unsafe-pr-checkout: true

      - name: Download verified stable release assets
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify-stable-apk.outputs.release-artifact-name }}
          path: ${{ runner.temp }}/release-assets

      - name: Confirm main is current
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          CURRENT_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$CURRENT_MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "The main branch has advanced; refusing to publish a stale stable release."
            exit 1
          fi

      - name: Publish or replace the stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-stable-apk.outputs.package-version }}
          name: v${{ needs.build-stable-apk.outputs.package-version }}
          prerelease: false
          make_latest: "true"
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          token: ${{ github.token }}
          body_path: ${{ runner.temp }}/release-assets/release-notes.md
          fail_on_unmatched_files: true
          preserve_order: true
          overwrite_files: true
          append_body: false
          files: |
            ${{ runner.temp }}/release-assets/app-full-release.apk
            ${{ runner.temp }}/release-assets/oai-update.json

      - name: Move stable tag to published commit
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build-stable-apk.outputs.package-version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          CURRENT_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$CURRENT_MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "The main branch has advanced; refusing to move a stale stable tag."
            exit 1
          fi
          RELEASE_TAG="v$PACKAGE_VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            CURRENT_TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            if [ "$CURRENT_TAG_SHA" != "$TARGET_SHA" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$TARGET_SHA" -F force=true >/dev/null
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$TARGET_SHA" >/dev/null
          fi
