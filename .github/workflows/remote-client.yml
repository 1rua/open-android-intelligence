name: Remote Client and Android

# Remote 固定来源、手机 MCP 与 Android 功能门禁按影响图并行运行。
# 未知变更扩大完整矩阵；签名 WASM 资产只构建一次并由相关 lane 读取。
# CI Gate 保留既有外部检查名称，发布仍验证同一提交的最新工作流结论。
on:
  pull_request:
    branches: [dev, main, 'release/*', 'release-*']
    # 支持 PR 打/摘全量标签（run-full-ci / full-regression / full-ci / release）后立即重跑或取消重型回归；
    # 普通标签变更会在并发组与 job 条件中静默跳过，不打断正在运行的 PR CI。
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev, main, 'release/*', 'release-*']
  workflow_dispatch:
    inputs:
      app-jvm-mode:
        description: App 测试进程隔离对照；所有模式执行相同必要测试
        type: choice
        options: [isolated, reuse]
        default: isolated
      app-forks:
        description: App 测试并发进程数的实测对照
        type: choice
        options: ['4', '2']
        default: '4'
      app-jit:
        description: App 测试 JIT 编译策略对照
        type: choice
        options: [default, startup]
        default: startup
      app-seed:
        description: 安全复用组的类与方法乱序种子
        type: string
        default: '135'
      app-gc:
        description: 测试 JVM 垃圾回收策略对照
        type: choice
        options: [default, serial]
        default: default

permissions:
  contents: read

concurrency:
  group: >-
    remote-client-${{
      github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) ||
      (github.event_name == 'pull_request' &&
       (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
       !contains(fromJSON('["run-full-ci","full-regression","full-ci","release"]'), github.event.label.name)) &&
        format('label-noop-{0}', github.run_id) ||
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      format('branch-{0}', github.ref)
    }}
  # PR 新提交或全量/发版标签增删立即取消同一 PR 的旧 CI 以释放 runner 并缩短等待；
  # 普通标签增删落入独立 label-noop 组，绝不打断正在运行的 PR CI；
  # dev/main/release* 分支 push 承担发布前门禁验证，禁止取消进行中的构建。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change Impact Analysis
    # 普通 PR 标签（非全量/发版标签）的增删直接静默跳过，不占用 runner 也不打断当前 PR 构建。
    if: >-
      !(github.event_name == 'pull_request' &&
        (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        !contains(fromJSON('["run-full-ci","full-regression","full-ci","release"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs_fast: ${{ steps.impact.outputs.runs_fast }}
      runs_remote: ${{ steps.impact.outputs.runs_remote }}
      runs_android_preflight: ${{ steps.impact.outputs.runs_android_preflight }}
      runs_android_app_compile: ${{ steps.impact.outputs.runs_android_app_compile }}
      runs_android_device: ${{ steps.impact.outputs.runs_android_device }}
      runs_android_platform: ${{ steps.impact.outputs.runs_android_platform }}
      runs_android_notifications: ${{ steps.impact.outputs.runs_android_notifications }}
      runs_android_conversation: ${{ steps.impact.outputs.runs_android_conversation }}
      runs_android_gateway: ${{ steps.impact.outputs.runs_android_gateway }}
      runs_android_plugins: ${{ steps.impact.outputs.runs_android_plugins }}
      runs_android_app: ${{ steps.impact.outputs.runs_android_app }}
      runs_android_play: ${{ steps.impact.outputs.runs_android_play }}
      app_regressions_allowed: ${{ steps.impact.outputs.app_regressions_allowed }}
      app_sections: ${{ steps.impact.outputs.app_sections }}
      full_required: ${{ steps.impact.outputs.full_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 影响分析需要 PR 的完整变更集；浅克隆会让 diff 为空。
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: impact
        env:
          # PR 用三点 diff（合并基 → head）；push 用两点 diff（上一个提交 → HEAD）。
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -o pipefail
          base="$BASE_REF"
          extra_args=()
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "::warning::No usable base commit; expanding to full lane matrix for current trigger context."
              extra_args+=(--unknown-diff)
              ;;
            *)
              extra_args+=(--base "$base" --head "$GITHUB_SHA")
              ;;
          esac
          python3 tools/ci/impact.py "${extra_args[@]}" \
            --event "$EVENT_NAME" \
            --ref "$GIT_REF" \
            --base-ref "$PR_BASE_REF" \
            --head-ref "$PR_HEAD_REF" \
            --labels-json "$PR_LABELS_JSON" \
            --json-out "$RUNNER_TEMP/impact.json" \
            --github-output | tee -a "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/impact.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          lines = [
              "## CI plan",
              "",
              f"changed paths: {len(data.get('paths', []))}",
              f"app/play regressions allowed: {'yes' if data.get('app_regressions_allowed') else 'no (deferred to main/dev/release* push, release PR, explicit label, or workflow_dispatch)'}",
              f"android preflight: {'run' if data.get('android_preflight') else 'skip'} | android app compile check: {'run' if data.get('android_app_compile') else 'skip'}",
              "",
          ]
          for lane, enabled in sorted(data.get("lanes", {}).items()):
              lines.append(f"- {'run ' if enabled else 'skip'} `{lane}`")
          if data.get("full_required"):
              lines.append("\nFull matrix forced for current trigger scope (security/contract/config change).")
          if data.get("unknown"):
              lines.append("\nDiff could not be classified; expanded all eligible lanes.")
          print("\n".join(lines))
          PY

  fast:
    name: Fast Gate
    needs: changes
    # 日常 Android PR 也在 CI 中并行跑 20s 的 Fast Gate，且不污染 impact.py 的 lanes["fast"] 本地语义。
    if: needs.changes.outputs.runs_fast == 'true' || needs.changes.outputs.runs_android_preflight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装门禁验证依赖
        run: python3 -m pip install --quiet --disable-pip-version-check pytest PyYAML==6.0.3

      - name: 安装根工具与插件工具依赖
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npm ci --prefix plugin-tooling --prefer-offline --no-audit --fund=false

      - name: 根工具与插件签名回归
        run: |
          npm test
          npm run typecheck

      - name: CI planning helpers
        run: >-
          python3 -m pytest -q -p no:cacheprovider tools/test_ci_planning.py tools/test_smart_test.py
          tools/test_android_jvm_reuse.py tools/test_android_app_performance.py
          tools/test_check_hardcoded_chinese.py tools/test_test_string_resources_integrity.py
          tools/test_verify_pr_source.py

  remote-sources:
    name: Remote Fixed Source Integrity
    needs: changes
    if: >-
      needs.changes.outputs.runs_fast == 'true' ||
      needs.changes.outputs.runs_remote == 'true' ||
      needs.changes.outputs.runs_android_preflight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
      - name: 校验固定 Remote 原文与许可摘要
        run: npm run lock:check

  remote:
    name: Remote phone MCP and ACP observations
    needs: changes
    if: needs.changes.outputs.runs_remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm

      - name: 安装固定Remote服务端隔离依赖
        run: npm ci --prefix tools/remote-server --prefer-offline --no-audit --fund=false

      - name: 固定服务端OAI版本协商回归
        run: npm test --prefix tools/remote-server

      - name: 安装独立手机 MCP 官方 SDK 依赖
        run: npm ci --prefix integrations/oai-android-mcp --prefer-offline --no-audit --fund=false

      - name: 手机 MCP 官方客户端与进程内桥回归
        run: npm run test:phone-mcp:unit

      - name: 固定 ACP 投影及媒体原文回归
        run: npm run test:remote

      - name: 当前源码编译与原生手机门面互通
        uses: ./.github/actions/android-lane
        with:
          lane: phone-mcp-interop

  # --- Android -------------------------------------------------------------
  android-setup:
    name: Android Fixtures
    needs: changes
    # 只有 plugins / app / play lane 会读取编译好的插件 WASM 载荷；其他模块 lane 不需要。
    if: |
      needs.changes.outputs.runs_android_plugins == 'true' ||
      (needs.changes.outputs.app_regressions_allowed == 'true' &&
       (needs.changes.outputs.runs_android_app == 'true' ||
        needs.changes.outputs.runs_android_play == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      wasm: ${{ steps.names.outputs.wasm }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 参考插件的真实编译产物是若干 app 测试的输入。编译一次、artifact 分发，
      # 而不是让 8 个 lane 各自跑一遍 cargo。
      #
      # 签名包不在这里构建：PR 级测试用仓库内夹具（TestAlpPackages）构造同构的
      # 签名包，只有发布与 APK 完整性校验才需要真实签名——那是 ci.yml / 发布
      # 工作流的职责，放在 PR 关键路径上只会白等一次 npm ci + 签名。
      - name: Cache the Rust plugin workspace
        uses: actions/cache@v4
        with:
          path: |
            plugins/target
            ~/.cargo/registry
            ~/.cargo/git
          key: plugins-${{ runner.os }}-${{ hashFiles('plugins/**/Cargo.toml', 'plugins/Cargo.lock', 'plugins/**/src/**') }}
          restore-keys: |
            plugins-${{ runner.os }}-

      - name: Build the bundled plugin WASM
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          if ! cargo +1.90.0 build --locked --offline --target wasm32-unknown-unknown \
              --release --manifest-path plugins/Cargo.toml --target-dir plugins/target; then
            cargo +1.90.0 build --locked --target wasm32-unknown-unknown \
              --release --manifest-path plugins/Cargo.toml --target-dir plugins/target
          fi
          for plugin in notifications sms call_log screen_reader screen_capture screen_control; do
            artifact="plugins/target/wasm32-unknown-unknown/release/${plugin}.wasm"
            if [ ! -s "$artifact" ]; then
              echo "::error::Missing compiled Android fixture: $artifact"
              exit 1
            fi
          done

      - name: Name the fixture artifact
        id: names
        run: echo "wasm=wasm-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload the WASM fixtures
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.wasm }}
          path: plugins/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 1

  android-preflight:
    name: Android Safety Gate
    # 独立于 android-setup，也独立于各 lane：扫描约 20 秒，串到每个 lane 前面
    # 只会把这 20 秒重复计 8 次到关键路径上。它作为独立门禁并行执行，
    # 由 gate 汇总时卡住——违规时仍然必红，但不拖慢正常路径。
    needs: changes
    if: needs.changes.outputs.runs_android_preflight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 各 Android 通道直接执行测试任务，不经过 Gradle check 生命周期。
      # 在共同预检中显式检查，避免未登记文案或资源缺项被 PR 流水线漏放。
      - name: Android 文案与资源门禁
        run: |
          python3 tools/check_hardcoded_chinese.py
          python3 tools/test_string_resources_integrity.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'workflow_dispatch' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev') }}

      # 越权面扫描是每个 Android lane 的共同前提，且足够廉价：
      # 让它先失败，比让 8 个 lane 各花几分钟才发现同一问题更省时间。
      - name: Forbidden-surface gate
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew noVpnSurfaceCheck --stacktrace

  android-device:
    name: Android Device & Authorization
    needs: changes
    if: needs.changes.outputs.runs_android_device == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-lane
        with:
          lane: android-device
          test-parallel-forks: '1'

  android-platform:
    name: Android Platform Kernel
    needs: changes
    if: needs.changes.outputs.runs_android_platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-lane
        with:
          lane: android-platform
          test-parallel-forks: '1'

  android-notifications:
    name: Android Settings & Notifications
    needs: changes
    if: needs.changes.outputs.runs_android_notifications == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-lane
        with:
          lane: android-notifications
          test-parallel-forks: '1'

  android-conversation:
    name: Android Conversation
    needs: changes
    if: needs.changes.outputs.runs_android_conversation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-lane
        with:
          lane: android-conversation
          test-parallel-forks: '1'

  android-gateway:
    name: Android Gateway Client
    needs: changes
    if: needs.changes.outputs.runs_android_gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-lane
        with:
          lane: android-gateway
          test-parallel-forks: '1'

  android-plugins:
    name: Android Plugin Modules
    # These tests execute the real compiled reference plugins
    # (plugin-runtime-wasm/CompiledReferencePluginTest), so the lane needs the
    # WASM fixture artifact and must follow android-setup.
    needs: [changes, android-setup]
    if: needs.changes.outputs.runs_android_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-lane
        with:
          lane: android-plugins
          wasm-artifact: ${{ needs.android-setup.outputs.wasm }}
          test-parallel-forks: '1'

  android-app-compile:
    name: Android App Compile Check
    # 日常 PR 跳过重型 App Robolectric 大回归时，独立并行校验 :app 主代码与测试源码均可编译，
    # 避免带语法/签名错误的改动绿灯合入 dev 并打断 dev-release.yml。不依赖 Rust WASM 夹具。
    needs: changes
    if: needs.changes.outputs.runs_android_app_compile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-lane
        with:
          lane: app-compile
          test-parallel-forks: '1'

  android-app:
    name: Android App Regressions
    needs: [changes, android-setup]
    if: >-
      needs.changes.outputs.runs_android_app == 'true' &&
      needs.changes.outputs.app_regressions_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 先保留一次编译：历史双分片曾因重复编译拖长关键路径。
      # 本轮重点优化测试执行；是否再次分片须由包含排队、编译与测试的总时间决定。
      - uses: ./.github/actions/android-lane
        with:
          lane: app-pr
          wasm-artifact: ${{ needs.android-setup.outputs.wasm }}
          app-sections: ${{ needs.changes.outputs.app_sections }}
          test-parallel-forks: ${{ inputs.app-forks || '4' }}
          app-jvm-mode: ${{ inputs.app-jvm-mode || 'isolated' }}
          app-test-seed: ${{ inputs.app-seed || '135' }}
          # 同源码、同恢复缓存实测：完整Test task 498.46→392.08秒，覆盖集合一致。
          app-jit: ${{ inputs.app-jit || 'startup' }}
          app-gc: ${{ inputs.app-gc || 'default' }}
          app-performance: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          # 手动性能对照只读取同一份既有缓存，避免先结束的样本替后一个写热缓存。
          gradle-cache-read-only: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

  android-play:
    name: Android Play Variant
    needs: [changes, android-setup]
    if: >-
      needs.changes.outputs.runs_android_play == 'true' &&
      needs.changes.outputs.app_regressions_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-lane
        with:
          lane: play
          wasm-artifact: ${{ needs.android-setup.outputs.wasm }}
          # 2 forks instead of 4: this lane's tests take ~50 s in total and the
          # lane is dominated by compilation, so extra forks buy almost nothing
          # while making the CPU scheduling visibly tighter. ColdStartConnectionTest
          # asserts a 100 ms connection-grace window, and it flaked under 4-way
          # contention. The lane still runs in parallel with the app lane.
          test-parallel-forks: '2'

  gate:
    name: CI Gate
    # 普通标签增删事件整条流水线静默跳过，避免覆盖既有提交的真实 CI Gate 结论。
    if: >-
      always() &&
      !(github.event_name == 'pull_request' &&
        (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        !contains(fromJSON('["run-full-ci","full-regression","full-ci","release"]'), github.event.label.name))
    needs:
      - changes
      - fast
      - remote-sources
      - remote
      # android-setup 必须在 gate 的依赖里：它失败时所有 android lane 都会
      # 被 skip，若不显式依赖，gate 会把「夹具没构建出来」误判为通过。
      - android-setup
      - android-preflight
      - android-app-compile
      - android-device
      - android-platform
      - android-notifications
      - android-conversation
      - android-gateway
      - android-plugins
      - android-app
      - android-play
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any selected job failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failed = []
          for name, job in needs.items():
              result = job.get("result")
              # "skipped" is legitimate: the impact analysis said that lane is
              # unaffected. Anything else non-success blocks the gate.
              if result not in {"success", "skipped"}:
                  failed.append(f"{name}={result}")
          if failed:
              print("::error::CI gate blocked: " + ", ".join(failed))
              sys.exit(1)
          print("CI gate satisfied: every selected lane passed.")
          PY
