name: Development Preview Release

# 合并进 dev 的提交本身就是一次 push，因此只由 push 触发即可。
#
# 为什么不再用 pull_request_target：
# pull_request_target 执行的是**默认分支（main）**上的工作流定义，但 checkout 的
# 却是 dev 的合并提交。只要 main 与 dev 的脚本命名不同步（例如 main 仍引用
# build:android-notifications，而 dev 已改为 build:android-plugins），这条 run
# 就必然失败，且失败原因与被合并的代码毫无关系。
#
# 原先的结构还带一个 release-event 门禁：push 提交若关联到已合并 PR 就跳过发布，
# 交给 pull_request_target 去发。两个条件叠加的结果是 push 被跳过、
# pull_request_target 又因脚本名不匹配而失败 —— 两条 run 都不发布，
# dev 预览版实际从未产出。
#
# 现在由 push 单独负责发布；发布说明改为优先读取关联 PR 正文（见
# apps/android/tools/prepare_release_notes.py），查不到再回退提交说明，
# 信息量与原来保持一致。
on:
  push:
    branches: [dev]
  # 支持手动重跑：发布失败后不必为了重发而制造一次空提交。
  workflow_dispatch:

permissions:
  contents: write
  # 发布说明需要读取关联 PR 正文。
  pull-requests: read

concurrency:
  group: dev-release
  cancel-in-progress: false
  queue: max

jobs:
  sign-plugin-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signed-artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for signed device packages
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: plugin-tooling/package-lock.json

      # 内置插件各自是一个 crate,统一用锁定工具链编译 WASM。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins -> plugins/target

      - name: Build the bundled plugin WASM
        run: |
          cargo +1.90.0 build --locked --target wasm32-unknown-unknown --release --manifest-path plugins/Cargo.toml -p open-android-intelligence-notifications -p open-android-intelligence-sms -p open-android-intelligence-call-log -p open-android-intelligence-screen-reader -p open-android-intelligence-screen-capture -p open-android-intelligence-screen-control
          npm ci --prefix plugin-tooling

      - name: Sign the bundled plugin packages
        env:
          OAI_PLUGIN_SIGNING_KEY_BASE64: ${{ secrets.OAI_PLUGIN_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$OAI_PLUGIN_SIGNING_KEY_BASE64" ]; then
            echo "::error::OAI_PLUGIN_SIGNING_KEY_BASE64 is required."
            exit 1
          fi
          umask 077
          OAI_PLUGIN_KEY_FILE="$RUNNER_TEMP/oai-plugin-seed.bin"
          trap 'if [ -f "$OAI_PLUGIN_KEY_FILE" ]; then mkdir -p "$RUNNER_TEMP/open-android-intelligence-trash"; mv "$OAI_PLUGIN_KEY_FILE" "$RUNNER_TEMP/open-android-intelligence-trash/oai-plugin-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"; fi' EXIT
          printf '%s' "$OAI_PLUGIN_SIGNING_KEY_BASE64" | base64 --decode > "$OAI_PLUGIN_KEY_FILE"
          mkdir -p "$RUNNER_TEMP/signed-plugins"
          OPEN_ANDROID_INTELLIGENCE_PLUGIN_SIGNING_KEY_FILE="$OAI_PLUGIN_KEY_FILE" \
            npm run build:android-plugins --prefix plugin-tooling -- "$RUNNER_TEMP/signed-plugins"

      - name: Set signed artifact name
        id: artifact-name
        run: echo "name=signed-plugins-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # 整目录上传,artifact 内含 六个独立授权的 .alp。
      - name: Upload the signed plugin packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/signed-plugins
          if-no-files-found: error
          retention-days: 1

  build-preview:
    needs: [sign-plugin-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.package-version.outputs.version }}
      release-artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require dev to include current main history
        run: |
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Merge the current main history into dev before publishing to keep versionCode monotonic."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract package version
        id: package-version
        run: echo "version=$(python3 apps/android/tools/extract_package_version.py --platform android)" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: python3 apps/android/tools/prepare_release_notes.py --branch dev --output "$RUNNER_TEMP/release-notes.md"

      - name: Resolve stable version-code high-water
        id: stable-version-code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null) || STABLE_TAG=""
          MINIMUM_VERSION_CODE=0
          if [ -n "$STABLE_TAG" ]; then
            if ! [[ "$STABLE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::The latest stable release tag is invalid."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/latest-stable-release"
            gh release download "$STABLE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern oai-update.json \
              --dir "$RUNNER_TEMP/latest-stable-release"
            MINIMUM_VERSION_CODE=$(python3 - "$RUNNER_TEMP/latest-stable-release/oai-update.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              manifest = json.load(source)
          version_code = manifest.get("versionCode")
          if manifest.get("channel") != "stable" or type(version_code) is not int or version_code < 1:
              raise SystemExit("The latest stable update manifest is invalid.")
          print(version_code)
          PY
          )
          fi
          echo "minimum=$MINIMUM_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        run: |
          python3 apps/android/tools/app_release_metadata.py prepare \
            --channel preview \
            --run-number "$GITHUB_RUN_NUMBER" \
            --minimum-version-code "${{ steps.stable-version-code.outputs.minimum }}" \
            --metadata "$RUNNER_TEMP/oai-release-metadata.json" \
            --github-env "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Download the signed plugin packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign-plugin-packages.outputs.signed-artifact-name }}
          path: ${{ runner.temp }}/signed-plugins

      - name: Set the bundled plugins directory
        run: echo "OAI_BUNDLED_PLUGINS_DIR=$RUNNER_TEMP/signed-plugins" >> "$GITHUB_ENV"

      - name: Prepare release signing key (optional)
        working-directory: apps/android
        env:
          OAI_RELEASE_KEYSTORE_BASE64: ${{ secrets.OAI_RELEASE_KEYSTORE_BASE64 }}
          OAI_RELEASE_KEYSTORE: ${{ runner.temp }}/oai-release.keystore
          OAI_RELEASE_STORE_PASSWORD: ${{ secrets.OAI_RELEASE_STORE_PASSWORD }}
          OAI_RELEASE_KEY_ALIAS: ${{ secrets.OAI_RELEASE_KEY_ALIAS }}
          OAI_RELEASE_KEY_PASSWORD: ${{ secrets.OAI_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$OAI_RELEASE_KEYSTORE_BASE64" ]; then
            test -n "$OAI_RELEASE_STORE_PASSWORD"
            test -n "$OAI_RELEASE_KEY_ALIAS"
            test -n "$OAI_RELEASE_KEY_PASSWORD"
            umask 077
            printf '%s' "$OAI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$OAI_RELEASE_KEYSTORE"
            echo "OAI_RELEASE_KEYSTORE=$OAI_RELEASE_KEYSTORE" >> "$GITHUB_ENV"
            echo "OAI_RELEASE_STORE_PASSWORD=$OAI_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "OAI_RELEASE_KEY_ALIAS=$OAI_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "OAI_RELEASE_KEY_PASSWORD=$OAI_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using unified GitHub Secrets release key for preview build."
          fi

      - name: Build Full Debug APK
        working-directory: apps/android
        env:
          LC_ALL: C.UTF-8
        run: |
          trap 'if [ -n "$OAI_RELEASE_KEYSTORE" ] && [ -f "$OAI_RELEASE_KEYSTORE" ]; then mkdir -p "$RUNNER_TEMP/open-android-intelligence-trash"; mv "$OAI_RELEASE_KEYSTORE" "$RUNNER_TEMP/open-android-intelligence-trash/oai-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keystore"; fi' EXIT
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug -Poai.requireBundledPlugins=true --stacktrace

      # 六个插件资产必须逐一与签出的包逐字节一致;缺一个就说明内置链路断了。
      - name: Verify the bundled plugin packages
        run: |
          for package in notifications sms call-log screen-reader screen-capture screen-control; do
            python3 apps/android/tools/verify_bundled_plugins.py \
              --apk apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk \
              --package "$package=$OAI_BUNDLED_PLUGINS_DIR/$package.alp"
          done

      - name: Verify Debug Signing Identity
        if: env.OAI_RELEASE_KEYSTORE == ''
        env:
          LC_ALL: C.UTF-8
        run: bash apps/android/tools/verify-debug-signing.sh apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Verify APK and create update metadata
        run: |
          python3 apps/android/tools/app_release_metadata.py manifest \
            --metadata "$RUNNER_TEMP/oai-release-metadata.json" \
            --apk apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk \
            --manifest "$RUNNER_TEMP/oai-update.json"

      - name: Stage release assets
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/oai-update.json" "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-assets/"

      - name: Set release artifact name
        id: artifact-name
        run: echo "name=preview-release-assets-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 1

  publish-preview:
    needs: [build-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-preview.outputs.release-artifact-name }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish development preview release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-preview.outputs.package-version }}-dev
          name: Development Preview v${{ needs.build-preview.outputs.package-version }}-dev
          prerelease: true
          make_latest: "false"
          target_commitish: ${{ github.sha }}
          token: ${{ github.token }}
          body_path: ${{ runner.temp }}/release-assets/release-notes.md
          fail_on_unmatched_files: true
          preserve_order: true
          overwrite_files: true
          append_body: false
          files: |
            ${{ runner.temp }}/release-assets/app-full-debug.apk
            ${{ runner.temp }}/release-assets/oai-update.json

      - name: Move dev tag to published commit
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build-preview.outputs.package-version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          RELEASE_TAG="v${PACKAGE_VERSION}-dev"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            CURRENT_TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            if [ "$CURRENT_TAG_SHA" != "$TARGET_SHA" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$TARGET_SHA" -F force=true >/dev/null
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$TARGET_SHA" >/dev/null
          fi
