name: Nightly Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-release:
    name: Build APK and Publish Nightly Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Full Debug APK
        working-directory: apps/android
        env:
          LC_ALL: C.UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --stacktrace

      # 发布前确认签名身份与仓库固定调试密钥一致：Nightly 包要能直接覆盖安装到用户手机上。
      - name: Verify Debug Signing Identity
        env:
          LC_ALL: C.UTF-8
        run: |
          bash apps/android/tools/verify-debug-signing.sh \
            apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Prepare Release Notes
        run: |
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          BUILD_TIME_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          BUILD_TIME_CST=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S CST")

          cat <<EOF > release_notes.md
          ### 📱 Open Android Intelligence - Nightly 自动化测试构建

          本构建为主分支最新的自动化滚动预览版本（Pre-release），供即装即测使用。

          - **构建时间**：${BUILD_TIME_CST} / ${BUILD_TIME_UTC}
          - **触发分支**：\`${{ github.ref_name }}\`
          - **提交信息**：${COMMIT_MSG}
          - **提交哈希**：[${COMMIT_SHA_SHORT}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **构建产物**：\`app-full-debug.apk\`（Full Flavor / Debug 构建，包含完整运行时插件与调试能力，已内置调试签名，手机可直接下载安装）

          > ⚠️ **提示**：Nightly 预览版本由主分支提交自动触发构建，可能包含未充分验证的改动，请勿用于正式生产环境。
          EOF

      - name: Update Nightly Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Publish Nightly Pre-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "nightly"
          name: "Nightly 测试预览版"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk
