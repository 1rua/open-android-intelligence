name: Android APK

# 编译出可直接安装的 APK，并上传为可下载的构建产物（Artifact）。
# v* 标签发布使用私有发行身份签名、不可调试的 FullRelease，并按版本号区分正式版和测试版。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成与发布渠道一致的版本信息
        run: |
          VERSION_TAG=nightly
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_TAG="$GITHUB_REF_NAME"
          fi
          python3 apps/android/tools/app_release_metadata.py prepare \
            --tag "$VERSION_TAG" \
            --metadata "$RUNNER_TEMP/oai-release-metadata.json" \
            --github-env "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js for signed device packages
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: plugin-tooling/package-lock.json

      - name: Build the real notification plugin WASM
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.90.0 build --locked --target wasm32-unknown-unknown --release --manifest-path plugins/Cargo.toml -p open-android-intelligence-notifications
          npm ci --prefix plugin-tooling

      - name: Sign the bundled notification device package
        env:
          OAI_PLUGIN_SIGNING_KEY_BASE64: ${{ secrets.OAI_PLUGIN_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$OAI_PLUGIN_SIGNING_KEY_BASE64" ]; then
            echo "::error::OAI_PLUGIN_SIGNING_KEY_BASE64 is required to ship the signed notification plugin."
            exit 1
          fi
          umask 077
          OAI_PLUGIN_KEY_FILE="$RUNNER_TEMP/oai-plugin-seed.bin"
          trap 'rm -f "$OAI_PLUGIN_KEY_FILE"' EXIT
          printf '%s' "$OAI_PLUGIN_SIGNING_KEY_BASE64" | base64 --decode > "$OAI_PLUGIN_KEY_FILE"
          OPEN_ANDROID_INTELLIGENCE_PLUGIN_SIGNING_KEY_FILE="$OAI_PLUGIN_KEY_FILE" \
            npm run build:android-notifications --prefix plugin-tooling -- "$RUNNER_TEMP/notifications.alp"
          echo "OAI_BUNDLED_NOTIFICATIONS_ALP=$RUNNER_TEMP/notifications.alp" >> "$GITHUB_ENV"

      - name: Build preview APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: apps/android
        env:
          LC_ALL: C.UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug -Poai.requireBundledNotifications=true --stacktrace

      - name: Verify the preview APK notification package
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          python3 apps/android/tools/verify_bundled_notifications.py \
            --apk apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk \
            --package "$OAI_BUNDLED_NOTIFICATIONS_ALP"

      # 固定 debug 签名的一致性是"能否直接覆盖安装"的前提：
      # 签名一旦与 app/keystore 里的固定密钥不符，安装时会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
      - name: Verify Debug Signing Identity
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          LC_ALL: C.UTF-8
        run: |
          bash apps/android/tools/verify-debug-signing.sh \
            apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: 核实开发预览 APK 并生成更新清单
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          python3 apps/android/tools/app_release_metadata.py manifest \
            --metadata "$RUNNER_TEMP/oai-release-metadata.json" \
            --apk apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk \
            --manifest apps/android/app/build/outputs/apk/full/debug/oai-update.json

      - name: Upload APK artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: app-full-debug
          path: |
            apps/android/app/build/outputs/apk/full/debug/app-full-debug.apk
            apps/android/app/build/outputs/apk/full/debug/oai-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Build privately signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/android
        env:
          OAI_RELEASE_KEYSTORE_BASE64: ${{ secrets.OAI_RELEASE_KEYSTORE_BASE64 }}
          OAI_RELEASE_KEYSTORE: ${{ runner.temp }}/oai-release.keystore
          OAI_RELEASE_STORE_PASSWORD: ${{ secrets.OAI_RELEASE_STORE_PASSWORD }}
          OAI_RELEASE_KEY_ALIAS: ${{ secrets.OAI_RELEASE_KEY_ALIAS }}
          OAI_RELEASE_KEY_PASSWORD: ${{ secrets.OAI_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$OAI_RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$OAI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$OAI_RELEASE_KEYSTORE"
          trap 'if [ -f "$OAI_RELEASE_KEYSTORE" ]; then mkdir -p "$RUNNER_TEMP/open-android-intelligence-trash"; mv "$OAI_RELEASE_KEYSTORE" "$RUNNER_TEMP/open-android-intelligence-trash/oai-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keystore"; fi' EXIT
          ./gradlew :app:assembleFullRelease -Poai.requireBundledNotifications=true --stacktrace

      - name: Verify the release APK notification package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 apps/android/tools/verify_bundled_notifications.py \
            --apk apps/android/app/build/outputs/apk/full/release/app-full-release.apk \
            --package "$OAI_BUNDLED_NOTIFICATIONS_ALP"

      - name: 核实正式版或编号测试版 APK 并生成发布清单
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 apps/android/tools/app_release_metadata.py manifest \
            --metadata "$RUNNER_TEMP/oai-release-metadata.json" \
            --apk apps/android/app/build/outputs/apk/full/release/app-full-release.apk \
            --manifest "$RUNNER_TEMP/oai-update.json" \
            --notes "$RUNNER_TEMP/oai-release-notes.md" \
            --repository "$GITHUB_REPOSITORY"

      - name: Publish release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [ "$OAI_UPDATE_CHANNEL" = preview ]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/oai-release-notes.md" \
            "${RELEASE_FLAGS[@]}" \
            apps/android/app/build/outputs/apk/full/release/app-full-release.apk \
            "$RUNNER_TEMP/oai-update.json"
