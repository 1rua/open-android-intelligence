name: OAI Core and Session Adapters

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'oai-core/**'
      - 'scripts/install.sh'
      - 'scripts/uninstall.sh'
      - 'scripts/setup.sh'
      - 'scripts/core_setup.py'
      - 'scripts/installer.py'
      - 'tests/test_scripts_*.py'
      - 'tests/test_setup_service_entrypoint.py'
      - 'tests/test_install_script.py'
      - 'tests/test_uninstall_script.py'
      - 'tests/test_core_setup_transaction.py'
      - 'tools/smart-test.py'
      - 'tools/test_smart_test.py'
      - 'integrations/dsh-session-adapter/**'
      - 'integrations/hermes-session-adapter/**'
      - 'gateway-contract/**'
      - 'plugins/**'
      - 'apps/android/**'
      - '.github/workflows/oai-core.yml'
  push:
    branches: [dev, main]
    paths:
      - 'oai-core/**'
      - 'scripts/install.sh'
      - 'scripts/uninstall.sh'
      - 'scripts/setup.sh'
      - 'scripts/core_setup.py'
      - 'scripts/installer.py'
      - 'tests/test_scripts_*.py'
      - 'tests/test_setup_service_entrypoint.py'
      - 'tests/test_install_script.py'
      - 'tests/test_uninstall_script.py'
      - 'tests/test_core_setup_transaction.py'
      - 'tools/smart-test.py'
      - 'tools/test_smart_test.py'
      - 'integrations/dsh-session-adapter/**'
      - 'integrations/hermes-session-adapter/**'
      - 'gateway-contract/**'
      - 'plugins/**'
      - 'apps/android/**'
      - '.github/workflows/oai-core.yml'
  workflow_dispatch:

concurrency:
  group: oai-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build standalone wheel and source distribution
        run: |
          python -m pip install build
          python -m build oai-core --outdir "$RUNNER_TEMP/core-dist"
      - name: Install only Core and its declared runtime dependencies
        run: |
          python -m venv "$RUNNER_TEMP/core-clean"
          "$RUNNER_TEMP/core-clean/bin/python" -m pip install "$RUNNER_TEMP"/core-dist/*.whl
          "$RUNNER_TEMP/core-clean/bin/python" -m pip check
      - name: Verify installed CLI and signed device flow without Hermes
        run: |
          env -u PYTHONPATH -u HERMES_SDK_ROOT "$RUNNER_TEMP/core-clean/bin/python" oai-core/tools/verify_distribution.py
          state=$(mktemp -d "$RUNNER_TEMP/core-independent.XXXXXX")
          env -u PYTHONPATH -u HERMES_SDK_ROOT "$RUNNER_TEMP/core-clean/bin/python" \
            oai-core/tests/independent_core_contract.py "$state"
      - name: Core protocol, security, CLI, MCP and installer regressions
        run: |
          "$RUNNER_TEMP/core-clean/bin/python" -m pip install pytest pytest-asyncio PyYAML==6.0.3
          env -u HERMES_SDK_ROOT -u PYTHONPATH "$RUNNER_TEMP/core-clean/bin/python" -m pytest \
            oai-core/tests tests/test_install_script.py tests/test_uninstall_script.py tests/test_core_setup_transaction.py tests/test_scripts_entrypoints.py tests/test_scripts_runtime.py tests/test_scripts_runtime_security.py tests/test_setup_service_entrypoint.py tools/test_smart_test.py -q \
            --ignore=oai-core/tests/test_hermes.py \
            --ignore=oai-core/tests/test_hermes_native.py \
            --ignore=oai-core/tests/test_hermes_session_key_recovery.py \
            --ignore=oai-core/tests/test_hermes_plugin_zero_config.py \
            --ignore=oai-core/tests/test_hermes_native_origin.py \
            --ignore=oai-core/tests/test_native_event_sync.py \
            --ignore=oai-core/tests/test_hermes_communication_reliability.py \
            --ignore=oai-core/tests/test_communication_process_recovery.py \
            --ignore=oai-core/tests/test_hermes_interactions.py \
            --ignore=oai-core/tests/test_hermes_approval_prompts.py \
            --ignore=oai-core/tests/test_structured_tool_history.py \
            --ignore=oai-core/tests/test_native_tool_events.py \
            --ignore=oai-core/tests/test_interaction_pipeline.py
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/setup.sh

  hermes-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional Session Adapter and native test dependencies
        run: >-
          python -m pip install -e ./oai-core -e ./integrations/hermes-session-adapter
          pytest pytest-asyncio PyYAML==6.0.3 python-dotenv==1.2.4 psutil==7.2.2 httpx==0.28.1 requests==2.33.0
      - name: Check out the pinned native Hermes SDK
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 75b083e9399115b12513385252811f09c3503c90
          path: .toolchains/hermes-native-sdk
      - name: Native SessionStore, account isolation and lifecycle contracts
        env:
          HERMES_SDK_ROOT: .toolchains/hermes-native-sdk
        run: >-
          python -m pytest oai-core/tests/test_hermes.py oai-core/tests/test_hermes_native.py
          oai-core/tests/test_hermes_native_origin.py oai-core/tests/test_hermes_zero_config_native.py oai-core/tests/test_agent_registration.py oai-core/tests/test_native_event_sync.py
          oai-core/tests/test_hermes_interactions.py oai-core/tests/test_interaction_pipeline.py
          oai-core/tests/test_hermes_approval_prompts.py
          oai-core/tests/test_hermes_session_key_recovery.py
          oai-core/tests/test_hermes_plugin_zero_config.py
          oai-core/tests/test_structured_tool_history.py oai-core/tests/test_native_tool_events.py
          oai-core/tests/test_hermes_dispatch_delivery.py
          oai-core/tests/test_hermes_communication_reliability.py
          oai-core/tests/test_communication_process_recovery.py -q

      - name: Communication measurement provenance and failure accounting
        run: python -m pytest -q tools/test_measure_communication.py

  dsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: DSH native session bridge syntax
        run: node --check integrations/dsh-session-adapter/index.js
      - name: DSH native session bridge regressions
        run: |
          npm ci
          npx vitest run --config integrations/dsh-session-adapter/vitest.config.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platforms
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
      # These tests install signed packages made from the real Rust payloads.
      # A fresh Actions checkout has no ignored plugins/target artifacts.
      - name: Setup Rust for Android reference plugins
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - name: Cache Android reference plugin builds
        uses: Swatinem/rust-cache@v2
        env:
          # Cache metadata runs inside plugins, whose local pin is 1.88.0.
          # Keep cache inspection aligned with the explicit CI build toolchain.
          RUSTUP_TOOLCHAIN: 1.90.0
        with:
          workspaces: plugins -> target
          cache-workspace-crates: true
      - name: Build real WASM fixtures before Android tests
        run: |
          cargo +1.90.0 build --locked --offline --target wasm32-unknown-unknown --release --manifest-path plugins/Cargo.toml --target-dir plugins/target
          for plugin in notifications sms call_log screen_reader screen_capture screen_control; do
            artifact="plugins/target/wasm32-unknown-unknown/release/${plugin}.wasm"
            if [ ! -s "$artifact" ]; then
              echo "::error::Missing compiled Android fixture: $artifact"
              exit 1
            fi
          done
      - name: Screen primitives, local authorization and projection lifecycle
        working-directory: apps/android
        run: >-
          gradle --max-workers=2
          :control-ports:testDebugUnitTest
          :capability-ports:testDebugUnitTest
          :screen-control:testDebugUnitTest
          :device-primitives:testDebugUnitTest
          :platform-kernel:testDebugUnitTest
          noVpnSurfaceCheck
      - name: Settings notification policy and encrypted state regressions
        working-directory: apps/android
        run: >-
          gradle --max-workers=2
          :notification-control:testDebugUnitTest
          :notification-host:testDebugUnitTest
          :notification-collector:testDebugUnitTest
          :policy-engine:testDebugUnitTest
          :encrypted-store:testDebugUnitTest
          :sms-collector:testDebugUnitTest
      - name: Conversation ordering, rendering, identity and persistence regressions
        working-directory: apps/android
        run: >-
          gradle --max-workers=2
          :conversation-domain:testDebugUnitTest
          :conversation-ui:testDebugUnitTest
      - name: Attachment upload phases and confirmed-upload recovery
        working-directory: apps/android
        run: >-
          gradle --max-workers=2
          :conversation-data:testDebugUnitTest
          --tests '*AttachmentPhaseTest'
          --tests '*AttachmentRecoveryTest'
      - name: Core connection, Agent sessions, platform recovery and transport regressions
        working-directory: apps/android
        run: >-
          gradle --max-workers=2
          :gateway-client:testDebugUnitTest
          :app:compileFullDebugKotlin
          :app:testFullDebugUnitTest
          --tests '*NativeAgentsControllerTest'
          --tests '*NativeAgentBackgroundWorkTest'
          --tests '*ColdStartConnectionTest'
          --tests '*DevicePushRuntimeTest'
          --tests '*DevicePushCycleTest'
          --tests '*DeviceCapabilityBlockTest'
          --tests '*PluginManagementGrantUiTest'
          --tests '*SettingsResponsiveHostRegressionTest'
          --tests '*GatewayTutorialsTest'
          --tests '*GatewaySessionRefreshTest'
          --tests '*GatewayWorkbenchLogoutTest'
          --tests '*DeviceExecutionRecoveryTest'
          --tests '*PlatformSnapshotRecoveryTest'
          --tests '*ScreenExecutionErrorsTest'
          --tests '*ScreenCapabilityPresentationTest'
          --tests '*ScreenCaptureSystemConsentTest'
          --tests '*ScreenControlConfirmationDialogTest'
          --tests '*NotificationAccessSettingsTest'
          --tests '*PluginCapabilityRiskTest'
          --tests '*CapabilityPublisherTest'
          --tests '*ApplicationCompositionTest'
          --tests '*AndroidApiCompatibilityTest'
          --tests '*CoreAgentConversationRepositoryTest'
          --tests '*NativeRecoveryOwnershipTest'
          --tests '*NativeConversationOrganizationStoreTest'
          --tests '*NativeConversationMirrorTest'
          --tests '*NativeEventOwnerTest'
          --tests '*NativeEventSynchronizerTest'
          --tests '*NativeRecoveryCommitTest'
          --tests '*DeviceCapabilitySyncStateTest'
          --tests '*ClientCapabilityAuthorizationTest'
          --tests '*PluginManagementScreenTest'
          --tests '*PairingGrantPersistenceTest'
          --tests '*PermissionCatalogTest'
          --tests '*SettingsCapabilityUiTest'
          --tests '*SettingsHonestyCopyTest'
          --tests '*NotificationCollectionScreenTest'
          --tests '*SmsPassiveScopeSettingsTest'
          --tests '*NotificationPushScopeSettingsTest'
          --tests '*PushSettingsScreenTest'
          --tests '*AppUpdateScreenTest'
          --tests '*NativeConnectionReliabilityTest'
          --tests '*NativeGenerationScopeTest'
          --tests '*PlatformStreamHandoverTest'
          --tests '*GatewayNetworkMonitorTest'
          --tests '*DeviceGrantFenceTest'
          --tests '*AccountSwitchPersistenceFailureTest'
          --tests '*IndependentConnectionDiscoveryTest'
          --tests '*AdditionalDeviceConnectionsTest'
          --tests '*SettingsViewModelTest'
          --tests '*SettingsStateIntegrityTest'
          --tests '*SettingsNavigationTest'
          --tests '*SettingsShortcutsTest'
          --tests '*TemporaryApprovalCopyTest'
          --tests '*CapabilitySettingsTest'
          --tests '*CapabilityCatalogTest'
          --tests '*CapabilityStateTest'
          --tests '*BuiltInCapabilitiesTest'
          --tests '*ScreenCaptureGrantRoutingTest'
          --tests '*InstalledNotificationAppCacheTest'
          --tests '*CapabilityTemporaryApprovalsTest'
          --tests '*SmsBackgroundConsentTest'
          --tests '*PushConfigurationSerializationTest'
          --tests '*NotificationScopeOwnershipTest'
          --tests '*LegacyOfficialCopyIsNeverLoadedTest'
          --tests '*AppearanceSettingsScreenTest'
          --tests '*AdvancedSettingsScreenTest'
          --tests '*MessageProcessingSettingsTest'
          --tests '*SettingsBackupCodecTest'
          --tests '*SettingsBackupCoordinatorTest'
          --tests '*SettingsBackupScreenTest'
          --tests '*LoginGatewayPrefillTest'
          --tests '*ReplyNotificationsTest'
          --tests '*LiveUpdateNotificationsTest'
          --tests '*NativeConversationNotificationsTest'
          --tests '*NativeEventDeletionPersistenceTest'
      - name: Play screen integration and Android API compatibility
        working-directory: apps/android
        run: >-
          gradle --max-workers=2
          :app:compilePlayDebugKotlin
          :app:testPlayDebugUnitTest
          --tests '*SettingsResponsiveHostRegressionTest'
          --tests '*CapabilityCatalogTest'
          --tests '*CapabilityStateTest'
          --tests '*BuiltInCapabilitiesTest'
          --tests '*ScreenCaptureGrantRoutingTest'
          --tests '*InstalledNotificationAppCacheTest'
          --tests '*CapabilityTemporaryApprovalsTest'
          --tests '*SmsBackgroundConsentTest'
          --tests '*PushConfigurationSerializationTest'
          --tests '*NotificationScopeOwnershipTest'
          --tests '*LegacyOfficialCopyIsNeverLoadedTest'
          --tests '*ScreenExecutionErrorsTest'
          --tests '*ScreenCapabilityPresentationTest'
          --tests '*ScreenCaptureSystemConsentTest'
          --tests '*ScreenControlConfirmationDialogTest'
          --tests '*NotificationAccessSettingsTest'
          --tests '*PluginCapabilityRiskTest'
          --tests '*CapabilityPublisherTest'
          --tests '*ApplicationCompositionTest'
          --tests '*AndroidApiCompatibilityTest'
          --tests '*CoreAgentConversationRepositoryTest'
          --tests '*ColdStartConnectionTest'
          --tests '*AccountSwitchPersistenceFailureTest'
          --tests '*IndependentConnectionDiscoveryTest'
          --tests '*AdditionalDeviceConnectionsTest'
          --tests '*SettingsViewModelTest'
          --tests '*NativeEventDeletionPersistenceTest'

      - name: Preserve Android test failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            apps/android/**/build/test-results/**/*.xml
            apps/android/**/build/reports/tests/**
