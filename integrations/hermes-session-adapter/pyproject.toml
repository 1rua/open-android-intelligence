[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oai-hermes-session-adapter"
version = "0.2.0"
description = "Optional account-isolated Hermes native session bridge for OAI Core"
requires-python = ">=3.11"
dependencies = ["open-android-intelligence-core>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]
